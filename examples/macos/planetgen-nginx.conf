# examples/macos/planetgen-nginx.conf
#
# Homebrew nginx in front of gunicorn (org.planetgen.gunicorn.plist) on
# macOS. Copy to $(brew --prefix)/etc/nginx/servers/planetgen.conf
# (/opt/homebrew on Apple Silicon, /usr/local on Intel). Same rules as
# examples/nginx/planetgen.conf; only the upstream, the log and
# certificate paths differ. See docs/deployment/macos.md.
#
# config.json needs "proxy_fix": {"x_for": 1, "x_proto": 1} so the app
# takes the client address and scheme from the headers set below.
#
# Homebrew's nginx.conf listens on 8080 as your user by default. To serve
# ports 80/443, run it as root (sudo brew services start nginx) and set,
# at the top of $(brew --prefix)/etc/nginx/nginx.conf:
#     user _www _www;
# so the workers can read the static files (root:_www, mode 750/640).

map $arg_v $planetgen_static_cache {
    ""      "no-cache";
    default "public, max-age=31536000, immutable";
}

upstream planetgen_app {
    server 127.0.0.1:8000 fail_timeout=0;
}

server {
    listen 80;
    server_name planetgen.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;                       # nginx 1.25.1+; older: "listen 443 ssl http2;"
    server_name planetgen.example.com;

    ssl_certificate     /usr/local/planetgen/certs/fullchain.pem;
    ssl_certificate_key /usr/local/planetgen/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /usr/local/planetgen/log/nginx_access.log;
    error_log  /usr/local/planetgen/log/nginx_error.log;

    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript text/javascript
               application/json image/svg+xml;

    location /static/ {
        alias /var/lib/planetGen/src/html/static/;
        autoindex off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control $planetgen_static_cache always;
    }

    location / {
        proxy_pass http://planetgen_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
