# fail2ban jail for planetGen's sign-in failures (SEC.27).
#
# Install as /etc/fail2ban/jail.d/planetgen.conf, with the filter as
# /etc/fail2ban/filter.d/planetgen.conf, then: sudo fail2ban-client reload
#
# The app already locks an address out itself after 3 failures (5 minutes,
# doubling to a day; docs/api.md). This jail goes further, dropping the
# address at the firewall so it can't reach the site at all: 10 failed
# sign-ins within 10 minutes bans it for an hour, and an address banned
# again is banned for longer each time, up to a week.
#
# Behind a reverse proxy, set proxy_fix in config.json first, or every
# visitor shares the proxy's address and the jail bans the proxy
# (docs/config.md). Add your own fixed address to ignoreip.

[planetgen]
enabled  = true
filter   = planetgen
# Linux default; macOS /Library/Logs/planetgen/planetgen-log. If you set
# log_dir in config.json, use that folder.
logpath  = /var/log/planetgen/planetgen-log
logtimezone = UTC
backend  = auto
port     = http,https
maxretry = 10
findtime = 10m
bantime  = 1h
bantime.increment = true
bantime.factor = 2
bantime.maxtime = 1w
ignoreip = 127.0.0.1/8 ::1
