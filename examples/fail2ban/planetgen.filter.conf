# fail2ban filter for planetGen's sign-in failures (SEC.27).
#
# Install as /etc/fail2ban/filter.d/planetgen.conf. It matches the
# activity log's failed sign-ins (docs/reference/config.md, "The activity log"):
#
#   2026-10-01T05:43:33-0400 planetgen[1234]: AUTH login.failed ip=203.0.113.9 user="admin"
#   2026-10-01T05:43:40-0400 planetgen[1234]: AUTH login.locked ip=203.0.113.9 user="admin" scope=ip retry_after=300
#   2026-10-01T05:44:02-0400 planetgen[1234]: AUTH password.failed ip=203.0.113.9 user="admin"
#   2026-10-01T05:44:30-0400 planetgen[1234]: AUTH totp.failed ip=203.0.113.9 user="admin"
#
# Lines whose address couldn't be read (ip=-) never match. Usernames are
# quoted and escaped by the app, so a username can't fake an ip= field.

[Definition]

failregex = ^ planetgen\[\d+\]: AUTH (?:login\.failed|login\.locked|password\.failed|totp\.failed) ip=<ADDR>(?: |$)

ignoreregex =

# The time comes first, local with the offset of its zone (OPS.97), so it reads the same whatever the server's time zone is.
datepattern = ^%%Y-%%m-%%dT%%H:%%M:%%S%%z
