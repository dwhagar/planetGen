# fail2ban filter for planetGen's sign-in failures (SEC.27).
#
# Install as /etc/fail2ban/filter.d/planetgen.conf. It matches the
# activity log's failed sign-ins (docs/config.md, "The activity log"):
#
#   2026-10-01T09:43:33Z planetgen[1234]: AUTH login.failed ip=203.0.113.9 user="admin"
#   2026-10-01T09:43:40Z planetgen[1234]: AUTH login.locked ip=203.0.113.9 user="admin" scope=ip retry_after=300
#   2026-10-01T09:44:02Z planetgen[1234]: AUTH password.failed ip=203.0.113.9 user="admin"
#   2026-10-01T09:44:30Z planetgen[1234]: AUTH totp.failed ip=203.0.113.9 user="admin"
#
# Lines whose address couldn't be read (ip=-) never match. Usernames are
# quoted and escaped by the app, so a username can't fake an ip= field.

[Definition]

failregex = ^ planetgen\[\d+\]: AUTH (?:login\.failed|login\.locked|password\.failed|totp\.failed) ip=<ADDR>(?: |$)

ignoreregex =

# The time comes first, in UTC with a trailing Z (the jail sets
# logtimezone = UTC).
datepattern = ^%%Y-%%m-%%dT%%H:%%M:%%SZ
