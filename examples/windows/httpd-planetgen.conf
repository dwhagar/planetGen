# examples/windows/httpd-planetgen.conf
#
# Apache httpd for Windows (Apache Lounge build) in front of waitress
# (planetgen-waitress.xml on 127.0.0.1:8000). docs/deployment/windows.md,
# option 3.
# Include it from C:\Apache24\conf\httpd.conf:
#     Include conf/extra/httpd-planetgen.conf
# and make sure these modules are loaded there (uncomment their
# LoadModule lines): headers, deflate, proxy, proxy_http, ssl,
# socache_shmcb, rewrite, alias.
#
# Same rules as examples/apache/planetgen.conf.example, except that the
# Flask app runs in waitress instead of mod_wsgi (mod_wsgi on Windows has
# no daemon mode and needs a compiler to install; windows.md explains).
# config.json's "proxy_fix" trusts one proxy for x_for and x_proto, so
# the app takes the client address and scheme from the headers below.

Listen 443

<VirtualHost *:80>
    ServerName planetgen.example.com
    RewriteEngine On
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName planetgen.example.com

    SSLEngine on
    # win-acme (or any ACME client) can write these files.
    SSLCertificateFile    "C:/ProgramData/planetgen/certs/planetgen.example.com-chain.pem"
    SSLCertificateKeyFile "C:/ProgramData/planetgen/certs/planetgen.example.com-key.pem"

    # The API's request bodies are small JSON documents.
    LimitRequestBody 1048576

    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/css application/javascript text/javascript application/json image/svg+xml
    </IfModule>

    # Static files straight from the checkout.
    Alias /static/ "C:/srv/planetGen/src/html/static/"
    <Directory "C:/srv/planetGen/src/html/static">
        Options -Indexes
        Require all granted
        Header always set X-Content-Type-Options "nosniff"
        <If "%{QUERY_STRING} =~ /(^|&)v=/">
            Header set Cache-Control "public, max-age=31536000, immutable"
        </If>
        <Else>
            Header set Cache-Control "no-cache"
        </Else>
    </Directory>

    # Everything else to waitress. /static/ is excluded first.
    ProxyPass        /static/ !
    ProxyPass        /  http://127.0.0.1:8000/ timeout=60
    ProxyPassReverse /  http://127.0.0.1:8000/
    ProxyPreserveHost On
    # mod_proxy_http adds X-Forwarded-For itself; add the scheme.
    RequestHeader set X-Forwarded-Proto "https"

    ErrorLog  "logs/planetgen_error.log"
    CustomLog "logs/planetgen_access.log" combined
</VirtualHost>
