# examples/redis/planetgen.conf -- Redis settings for planetGen (OPS.48)
#
# Redis here holds the work queue (running jobs and their progress), the
# rate limits and the login lockouts. Out of the box Redis keeps nothing
# on disk between saves: in the review's test a `kill -9` lost every key,
# while `appendonly yes` with `appendfsync everysec` kept them all (at
# most about one second is lost on a crash).
#
# Install: put these lines in your Redis config, or include this file from
# it with a line `include /path/to/planetgen.conf` at the END of
# /etc/redis/redis.conf (Debian, Ubuntu; later lines win), then restart
# Redis: sudo systemctl restart redis-server (macOS: brew services restart
# redis). update.sh checks the running server and prints the exact line to
# add for anything that is off; it never edits your Redis config.

# Listen on this machine only. Nothing but planetGen should reach Redis.
bind 127.0.0.1 -::1
protected-mode yes

# Keep the data across a crash or restart.
appendonly yes
appendfsync everysec
save 3600 1 300 100 60 10000

# A guard, not a working limit: the queue is small (under 10 MB), so a
# runaway shows up as write errors here instead of the host swapping.
# noeviction never throws away a queue entry or a lockout to make room.
maxmemory 512mb
maxmemory-policy noeviction

# No password while Redis binds loopback and one person uses the machine.
# To add one later, create an ACL user and put it in config.json's
# redis.url (redis://planetgen:SECRET@127.0.0.1:6379/0):
#   user planetgen on >SECRET ~* &* +@all -@dangerous
