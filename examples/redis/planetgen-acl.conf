# examples/redis/planetgen-acl.conf -- a Redis user for planetGen (SEC.39)
#
# Without this, any user on the machine can connect to Redis and queue a job, and a planetGen
# worker runs the function the job names. planetGen's queues carry JSON, never pickle, so a
# job cannot smuggle in an object, but a job still names a function. The fix is a password:
# Redis then lets only planetGen (and you) in. update.sh warns while the server lets anyone in.
#
# Install (one time, as root; update.sh never edits your Redis config):
#   1. Make a password:      openssl rand -hex 24
#   2. Copy this file next to your Redis config and put the password in place of
#      A-LONG-RANDOM-PASSWORD below, in this one line only. Keep the file readable by redis
#      only:            sudo chown redis:redis planetgen-acl.conf && sudo chmod 600 planetgen-acl.conf
#   3. Put the line  include /path/to/planetgen-acl.conf  at the END of /etc/redis/redis.conf
#      (after the include of planetgen.conf), and restart Redis: sudo systemctl restart redis-server
#   4. In planetGen's config.json put the same password in the URL:
#          "redis": {"url": "redis://planetgen:A-LONG-RANDOM-PASSWORD@127.0.0.1:6379/0"}
#      (or set PLANETGEN_REDIS_URL), then run update.sh: its Redis check logs in as that user.
#
# What the user may do: everything planetGen needs (queues, rate limits, lockouts, the page cache,
# INFO for the health page, CONFIG GET for update.sh's check) and not the dangerous group
# (FLUSHALL, KEYS, CONFIG SET, SHUTDOWN, DEBUG, ACL, ...). Checked 2026-11-07 by running the
# queue, worker, update-guard and stop-all tests as this user (the tests' own FLUSHDB cleanup
# needs a Redis of their own).

user default off
user planetgen on >A-LONG-RANDOM-PASSWORD ~* &* +@all -@dangerous +config|get +info +client|list
