# examples/systemd/planetgen-update.service.d/reload-web.conf
#
# Optional drop-in for examples/maintenance/planetgen-update.service on a
# gunicorn host (nginx or Caddy in front). update.sh pulls new code but
# only prints "reload Apache"; this reloads gunicorn after a successful
# run so the site serves the new code. Reload keeps a running Generate
# job alive (see planetgen-gunicorn.service).
#
# Install:
#     sudo mkdir -p /etc/systemd/system/planetgen-update.service.d
#     sudo cp reload-web.conf /etc/systemd/system/planetgen-update.service.d/
#     sudo systemctl daemon-reload

[Service]
ExecStartPost=/bin/systemctl try-reload-or-restart planetgen-gunicorn.service
