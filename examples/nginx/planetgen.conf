# examples/nginx/planetgen.conf
#
# nginx site for planetGen, the nginx + gunicorn equivalent of
# examples/apache/planetgen.conf.example (docs/deployment/nginx.md). Copy to
# /etc/nginx/sites-available/planetgen (Debian/Ubuntu) or
# /etc/nginx/conf.d/planetgen.conf (other distributions), edit
# server_name and the certificate paths, then:
#
#     sudo ln -s /etc/nginx/sites-available/planetgen /etc/nginx/sites-enabled/
#     sudo nginx -t && sudo systemctl reload nginx
#
# What it reproduces from the Apache vhost:
#   - /static/ is served straight from src/html/static/ by nginx, with
#     X-Content-Type-Options: nosniff and the same Cache-Control rule
#     (a year and immutable when the URL carries ?v=, no-cache otherwise).
#   - Every other URL goes to the Flask app (gunicorn, see
#     examples/systemd/planetgen-gunicorn.service). Nothing else under
#     src/html (lib/, api/, wsgi.py) is ever read from disk by nginx, which
#     is what the Apache vhost's "Require all denied" blocks achieve.
#   - Compression for HTML, CSS, JavaScript, JSON and SVG.
#   - A 60-second limit on an app response, matching the Apache daemon's
#     request-timeout=60.
#   - No security headers on app responses: the app sets its own
#     (src/html/web/__init__.py SECURITY_HEADERS, src/html/api/app.py), and
#     sends Strict-Transport-Security itself on HTTPS requests.
#
# The app only sees nginx's connection, so config.json needs
#     "proxy_fix": {"x_for": 1, "x_proto": 1, "x_host": 0}
# to take the client address and scheme from the X-Forwarded-For and
# X-Forwarded-Proto headers set below (docs/config.md). Without it every
# visitor shares one rate-limit budget and no HSTS header is sent.
#
# Paths assume the checkout at /var/lib/planetGen, as in the Apache guide.

# ?v=<release> on a static URL -> cache for a year; no ?v= -> revalidate.
map $arg_v $planetgen_static_cache {
    ""      "no-cache";
    default "public, max-age=31536000, immutable";
}

upstream planetgen_app {
    # gunicorn's socket (RuntimeDirectory=planetgen in the systemd unit).
    server unix:/run/planetgen/gunicorn.sock fail_timeout=0;
}

# Plain HTTP: only redirects to HTTPS (and answers ACME HTTP-01 checks if
# certbot uses the webroot method). The admin pages need HTTPS: their
# session cookie is Secure.
server {
    listen 80;
    listen [::]:80;
    server_name planetgen.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                       # nginx 1.25.1+; older: "listen 443 ssl http2;"
    server_name planetgen.example.com;

    # certbot --nginx fills these in, or point them at your own files.
    ssl_certificate     /etc/letsencrypt/live/planetgen.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/planetgen.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:planetgen_ssl:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/planetgen_access.log;
    error_log  /var/log/nginx/planetgen_error.log;

    # The API's request bodies are small JSON documents (sector and system
    # recipes, logins, wiki publish requests). 1 MB is nginx's default,
    # stated here so it is a decision rather than an accident; raise it if
    # a POST ever fails with 413.
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript text/javascript
               application/json image/svg+xml;     # text/html is always on

    # Static files: both the location and the alias end in "/", which
    # keeps a request like /static../ from escaping the directory.
    location /static/ {
        alias /var/lib/planetGen/src/html/static/;
        autoindex off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control $planetgen_static_cache always;
        access_log off;
    }

    location / {
        proxy_pass http://planetgen_app;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_redirect off;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;   # matches mod_wsgi request-timeout=60

        # Pages and API responses are small; buffering lets gunicorn's
        # threads move on while nginx feeds slow clients.
        proxy_buffering on;
    }
}
