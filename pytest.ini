[pytest]
testpaths = src/tests
# src/ needs to be on the path for `import stellarObjects`/`import queryDb`
# (src layout); "." for `sectorGen`/`systemGen`, the top-level entry
# scripts that stay at the repo root; src/html/ for `import api` (moved
# there from src/api/ so it's served from the same tree as the interim
# browser -- see html/wsgi.py and docs/TODO.md).
pythonpath = . src src/html
markers =
    tier2: secondary/statistical bug-hunt checks (see src/tests/bughunt_support.py) -- always run, reported rather than hard-failed on a soft violation.
    real_password_hashing: keep production's PBKDF2 round count for this test (src/tests/conftest.py otherwise makes password hashing cheap).
    db: uses a real MySQL/MariaDB database (added in src/tests/conftest.py to every test using the mysql_config fixture); `-m "not db"` runs without one.
    slow: brute-force and seeded-sweep tests (test_fuzz_*, test_bughunt_*; added in conftest.py); `-m "not slow"` for a quick loop.
    browser: headless-browser checks (test_web_a11y.py; added in conftest.py).
    generation: tests that run generation (added in conftest.py); CI also runs them with PLANETGEN_WORKERS=2 and 4 (TEST.74).
    mathcheck: the math check gate (test_math_check.py, planetgen/physics/mathcheck.py); conftest.py runs these first, and stops the whole run before any test if the math check fails.
