[pytest]
testpaths = src/tests
pythonpath = src
addopts = -p tests.depmap
markers =
    tier2: secondary/statistical bug-hunt checks (see src/tests/bughunt_support.py) -- always run, reported rather than hard-failed on a soft violation.
    real_password_hashing: keep production's PBKDF2 round count for this test (src/tests/conftest.py otherwise makes password hashing cheap).
    db: uses a real MySQL/MariaDB database (added in src/tests/conftest.py to every test using the mysql_config or _mysql_server_available fixture); `-m "not db"` runs without one.
    fresh_database: the test needs a database with no schema at all (or its own); it gets a new one instead of the worker's reused database (src/tests/dbpool.py, TEST.139).
    viewport: (width, height) window for a browser test in test_web_browser_fixture_maps.py; the default is smaller because reading a software-WebGL canvas costs time in proportion to its pixels (TEST.139).
    budget: the big-galaxy query budget (TEST.133): needs a 2,000,000-system database that takes minutes to build, so it is skipped unless PLANETGEN_BUDGET=1 (scripts/test.py budget).
    slow: brute-force and seeded-sweep tests (test_fuzz_*, test_bughunt_*; added in conftest.py); `-m "not slow"` for a quick loop.
    browser: headless-browser checks (test_web_a11y.py; added in conftest.py).
    generation: tests that run generation (added in conftest.py); CI also runs them with PLANETGEN_WORKERS=2 and 4 (TEST.74).
    mathcheck: the math check gate (test_math_check.py, planetgen/physics/mathcheck.py); conftest.py runs these first, and stops the whole run before any test if the math check fails.
    heavy: the files that took over 100 s each in the 2026-10-14 baseline (src/tests/areas.py HEAVY_FILES; added in conftest.py); scripts/test.py quick leaves them out.
    area_web: tests of the web area (by file name, src/tests/areas.py; added in conftest.py); `-m area_web`.
    area_api: tests of the api area (by file name, src/tests/areas.py; added in conftest.py); `-m area_api`.
    area_db: tests of the db area (by file name, src/tests/areas.py; added in conftest.py); `-m area_db`.
    area_generation: tests of the generation area (by file name, src/tests/areas.py; added in conftest.py); `-m area_generation`.
    area_physics: tests of the physics area (by file name, src/tests/areas.py; added in conftest.py); `-m area_physics`.
    area_names: tests of the names area (by file name, src/tests/areas.py; added in conftest.py); `-m area_names`.
    area_wiki: tests of the wiki area (by file name, src/tests/areas.py; added in conftest.py); `-m area_wiki`.
    area_ops: tests of the ops area (by file name, src/tests/areas.py; added in conftest.py); `-m area_ops`.
    area_other: tests of the other area (by file name, src/tests/areas.py; added in conftest.py); `-m area_other`.
