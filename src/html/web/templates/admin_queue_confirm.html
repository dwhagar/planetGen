{#- html/web/templates/admin_queue_confirm.html -- confirms a work queue
control before it runs (ADM.10). -#}
{% extends "base.html" %}
{% block content %}
<section class="panel" aria-labelledby="confirm-heading">
  <h2 id="confirm-heading">{{ heading }}</h2>
  {%- if explanation %}<p>{{ explanation }}</p>{% endif %}
  <form method="post" action="{{ url_for('web.admin_queue_action') }}" class="table-form">
    {{ csrf_field() }}
    <input type="hidden" name="action" value="{{ action }}">
    <input type="hidden" name="node" value="{{ node_id }}">
    {%- if task_id %}<input type="hidden" name="task" value="{{ task_id }}">{% endif %}
    <button type="submit" class="btn{% if action in ('cancel', 'delete', 'queue-pause', 'clear-lease') %} btn-danger{% endif %}">{{ button }}</button>
    <a href="{{ back }}">Go back</a>
  </form>
</section>
{% endblock %}
