{% extends "base.html" %}
{% block content %}
<section class="panel">
  <h2>Sign in</h2>
  {%- if error %}
  <p class="error" role="alert">{{ error }}</p>
  {%- endif %}
  <form method="post" action="{{ url_for('web.login') }}" class="search-form">
    {{ csrf_field() }}
    <input type="hidden" name="next" value="{{ next_url }}">
    <div class="search-fields">
      <label class="search-field">Username
        <input type="text" name="username" value="{{ username }}" autocomplete="username" autocapitalize="none" spellcheck="false" required{% if not username %} autofocus{% endif %}>
      </label>
      <label class="search-field">Password
        <input type="password" name="password" autocomplete="current-password" required{% if username %} autofocus{% endif %}>
      </label>
    </div>
    <div class="search-actions">
      <button type="submit" class="btn">Log in</button>
    </div>
  </form>
</section>
{% endblock %}
