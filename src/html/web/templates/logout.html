{% extends "base.html" %}
{% block content %}
<section class="panel">
  {%- if admin %}
  <p>You are signed in as <strong>{{ admin.username }}</strong>.</p>
  <form method="post" action="{{ url_for('web.logout') }}" class="search-form">
    {{ csrf_field() }}
    <div class="search-actions">
      <button type="submit" class="btn">Log out</button>
      <a href="{{ url_for('web.admin') }}">Cancel</a>
    </div>
  </form>
  {%- else %}
  <p>You are not signed in.</p>
  <p><a href="{{ url_for('web.index') }}">Back to the home page</a></p>
  {%- endif %}
</section>
{% endblock %}
