<svg xmlns="http://www.w3.org/2000/svg">
  <!-- UX.28: the site's icons, one sprite (Boss approved the set
       2026-10-02). Use them through `icon(name)` (web/lib/fmt.py), which
       checks the name against ICON_NAMES; a new symbol goes in both. Each
       is a 24x24 outline drawn in currentColor, so it takes the text color
       of the button it sits in. -->
  <defs>
    <style>symbol { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }</style>
  </defs>
  <symbol id="edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></symbol>
  <symbol id="delete" viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/><path d="M10 11v6"/><path d="M14 11v6"/></symbol>
  <symbol id="show-on-map" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><path d="M12 2v5"/><path d="M12 17v5"/><path d="M2 12h5"/><path d="M17 12h5"/></symbol>
  <symbol id="filter" viewBox="0 0 24 24"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></symbol>
  <symbol id="navigate" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></symbol>
  <symbol id="menu" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
  <symbol id="settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2l1.6 2.4 2.8-.8.7 2.8 2.8.7-.8 2.8L22 12l-2.4 1.6.8 2.8-2.8.7-.7 2.8-2.8-.8L12 22l-1.6-2.4-2.8.8-.7-2.8-2.8-.7.8-2.8L2 12l2.4-1.6-.8-2.8 2.8-.7.7-2.8 2.8.8z"/></symbol>
  <symbol id="back" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
  <symbol id="forward" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="up" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></symbol>
  <symbol id="reset" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.3-5.7"/><path d="M4 4v5h5"/></symbol>
  <symbol id="bookmark" viewBox="0 0 24 24"><path d="M6 4h12v17l-6-4-6 4z"/></symbol>
  <!-- UX.101: the PHI-6 habitability symbols (Boss, issue #1221). Same 24x24 outline in currentColor; the page colours
       each by its rating with the `tier-blue` .. `tier-red` classes, through `habitability_symbol(domain, tier)`
       (web/lib/habitability_symbols.py). Enclosed dots are filled so they read at 16 px. -->
  <symbol id="hab-radiation" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.4" fill="currentColor"/><path d="M8.01 4.49A8.5 8.5 0 0 1 15.99 4.49M20.49 12.30A8.5 8.5 0 0 1 16.50 19.21M7.50 19.21A8.5 8.5 0 0 1 3.51 12.30"/></symbol>
  <symbol id="hab-temperature" viewBox="0 0 24 24"><path d="M12 3.5L21.5 20h-19z"/><path d="M12 3.5V20"/></symbol>
  <symbol id="hab-pressure" viewBox="0 0 24 24"><rect x="10" y="10" width="4" height="4"/><path d="M2 8v8l6.93-4z"/><path d="M22 8v8l-6.93-4z"/></symbol>
  <symbol id="hab-air" viewBox="0 0 24 24"><path d="M12 2l8.66 5v10L12 22l-8.66-5V7z"/><path d="M8 9.5h8M8 12h8M8 14.5h8"/></symbol>
  <symbol id="hab-water" viewBox="0 0 24 24"><path d="M2.5 4.5h19L12 21z"/><circle cx="12" cy="10" r="2.6"/></symbol>
  <symbol id="hab-suitability" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 5.5l6.5 6.5-6.5 6.5L5.5 12z"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></symbol>
  <symbol id="hab-overall" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.2"/><path d="M12 4.2l6.75 11.7h-13.5z"/><circle cx="12" cy="12" r="2.2" fill="currentColor"/></symbol>
  <!-- UX.101 (Boss, 6:14 PM EDT 2026-10-23): the four life scores, each drawn beside a number 0 to 9. -->
  <symbol id="life-microbial" viewBox="0 0 24 24"><circle cx="9" cy="10" r="4"/><circle cx="17" cy="8.5" r="2.5"/><circle cx="15" cy="16.5" r="3.5"/><circle cx="6" cy="18.5" r="1.5" fill="currentColor"/></symbol>
  <symbol id="life-flora" viewBox="0 0 24 24"><path d="M12 21V11"/><path d="M12 15C7 15 4.5 12 4.5 7.5 9 7.5 12 10 12 15z"/><path d="M12 11C12 6 15 3 20 3c0 5-3 8-8 8z"/></symbol>
  <symbol id="life-fauna" viewBox="0 0 24 24"><path d="M12 21c-3.5 0-6-1.8-6-4.2 0-2.5 3-5.3 6-5.3s6 2.8 6 5.3c0 2.4-2.5 4.2-6 4.2z"/><circle cx="4.5" cy="10" r="1.7" fill="currentColor"/><circle cx="9" cy="5.5" r="1.7" fill="currentColor"/><circle cx="15" cy="5.5" r="1.7" fill="currentColor"/><circle cx="19.5" cy="10" r="1.7" fill="currentColor"/></symbol>
  <symbol id="life-sentient" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.5 3.5-7 8-7s8 2.5 8 7"/></symbol>
</svg>
