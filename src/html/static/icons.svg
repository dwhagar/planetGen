<svg xmlns="http://www.w3.org/2000/svg">
  <!-- UX.28: the site's icons, one sprite (Boss approved the set
       2026-10-02). Use them through `icon(name)` (web/lib/fmt.py), which
       checks the name against ICON_NAMES; a new symbol goes in both. Each
       is a 24x24 outline drawn in currentColor, so it takes the text color
       of the button it sits in. The outline (fill none, stroke currentColor,
       width 2, round) is the `.icon` rule of style.css, not a style element here:
       the Content-Security-Policy refuses an inline style in this file. A
       shape that is filled sets fill="currentColor" and stroke="none". -->
