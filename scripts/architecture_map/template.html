<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>planetGen Architecture Map</title>
<meta name="description" content="The code map: the project's areas, their modules, each module's functions with what calls what, and the main flows traced from the code; open it to find where something lives.">
<style>
/* Generated by scripts/build_architecture_map.py from src/planetgen (DOC.67): do not edit by hand. */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --sunk:#E9EDF3; --ink:#152030; --muted:#566275; --line:#D8DEE7;
  --accent:#B05E0C; --accent-soft:#F6E7D6; --link:#1F5FA8; --ok:#2F6E3A; --warn:#B3261E; --probable:#8A6A00;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0C1118; --surface:#141B25; --sunk:#1A2330; --ink:#E5EAF1; --muted:#97A3B5; --line:#273244;
  --accent:#E7A05A; --accent-soft:#3A2814; --link:#7DB4F0; --ok:#7FC98B; --warn:#F2786E; --probable:#D9B84A;
  color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body)}
a{color:var(--link);text-decoration:none} a:hover{text-decoration:underline}
header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
header h1{font-size:17px;margin:0;font-weight:700}
header nav{display:flex;gap:14px;font-size:14px}
#search{flex:1 1 220px;min-width:180px;max-width:420px;padding:6px 10px;border:1px solid var(--line);
  border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
#results{position:absolute;top:100%;left:0;right:0;background:var(--surface);border-bottom:1px solid var(--line);
  max-height:50vh;overflow:auto;display:none;padding:6px 16px}
#results a{display:block;padding:2px 0;font-family:var(--f-mono);font-size:13px}
#results .none{color:var(--muted)}
main{max-width:1100px;margin:0 auto;padding:18px 16px 60px}
h2{font-size:22px;margin:6px 0 4px} h3{font-size:16px;margin:22px 0 6px}
.crumbs{font-size:13px;color:var(--muted);margin-bottom:6px}
.lead{color:var(--muted);margin:2px 0 14px}
.muted{color:var(--muted)}
table{border-collapse:collapse;width:100%;background:var(--surface);border:1px solid var(--line);font-size:14px}
th,td{padding:6px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--sunk);font-weight:600;font-size:13px}
td.num,th.num{text-align:right;white-space:nowrap}
code,.mono{font-family:var(--f-mono);font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.card b{display:block;margin-bottom:2px}
.card small{color:var(--muted);display:block}
svg{width:100%;height:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
svg .box{fill:var(--sunk);stroke:var(--line);stroke-width:1.2;cursor:pointer}
svg .box:hover{fill:var(--accent-soft);stroke:var(--accent)}
svg text{fill:var(--ink);font:600 13px var(--f-body);pointer-events:none}
svg text.sub{fill:var(--muted);font:12px var(--f-body)}
svg .edge{stroke:var(--accent);fill:none;opacity:.1;cursor:pointer}
svg .edge.strong{opacity:.4}
svg.focus .edge{opacity:.03}
svg.focus .edge.out{stroke:var(--accent);opacity:.85}
svg.focus .edge.in{stroke:var(--link);opacity:.85}
svg .edge:hover{opacity:1}
pre.src{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 0;overflow:auto;
  font:13px/1.45 var(--f-mono);margin:6px 0}
pre.src span.ln{display:inline-block;width:3.6em;text-align:right;padding-right:10px;color:var(--muted);user-select:none}
.badge{display:inline-block;font-size:11px;padding:0 6px;border-radius:9px;border:1px solid var(--line);margin-left:6px}
.badge.probable{color:var(--probable);border-color:var(--probable)}
.badge.kind{color:var(--muted)}
ul.edges{list-style:none;margin:4px 0;padding:0} ul.edges li{padding:1px 0;font-family:var(--f-mono);font-size:13px}
ul.edges li .where{color:var(--muted)}
ul.unres{margin:4px 0;padding-left:18px;font-family:var(--f-mono);font-size:13px;color:var(--muted);columns:2}
details{margin:2px 0}
details>summary{cursor:pointer}
.tree{list-style:none;margin:0;padding-left:20px;border-left:1px dotted var(--line)}
.tree li{padding:1px 0;font-family:var(--f-mono);font-size:13px}
.loading{padding:24px;color:var(--muted)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
@media (max-width:760px){.cols{grid-template-columns:1fr} ul.unres{columns:1}}
</style>
<header>
  <h1><a href="#/">planetGen Architecture Map</a></h1>
  <nav><a href="#/">Project map</a><a href="#/flow">Flows</a><a href="architecture.html">Overview page</a><a href="../index.html">Docs index</a></nav>
  <input id="search" type="search" placeholder="Find a module or function" autocomplete="off" aria-label="Find a module or function">
  <div id="results"></div>
</header>
<main id="app"><div class="loading">Reading the code map...</div></main>
<script type="application/json" id="light">/*LIGHT*/</script>
<script type="text/plain" id="heavy">/*HEAVY*/</script>
<script>
"use strict";
const LIGHT = JSON.parse(document.getElementById("light").textContent);
const MODULES = LIGHT.modules, AREAS = LIGHT.areas;
const AREA_BY_KEY = {}; AREAS.forEach(a => AREA_BY_KEY[a.key] = a);
const MODULE_BY_NAME = {}; MODULES.forEach((m, i) => MODULE_BY_NAME[m.name] = i);
const app = document.getElementById("app");
let HEAVY = null, FN = [], FN_BY_KEY = {}, CALLED_BY = [], IMPORTED_BY = [], MOD_FUNCS = [], SOURCES = {}, SRC_LINES = {};

const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const short = name => name.replace(/^planetgen\./, "");
const modLink = i => `<a href="#/mod/${MODULES[i].name}">${esc(short(MODULES[i].name))}</a>`;
const fnHref = i => `#/fn/${MODULES[FN[i].module].name}/${FN[i].name}`;
const fnLink = i => `<a href="${fnHref(i)}">${esc(FN[i].name)}</a>`;
const fnFull = i => `<a href="${fnHref(i)}">${esc(FN[i].name)}</a> <span class="where">${esc(short(MODULES[FN[i].module].name))}</span>`;

async function inflate(b64) {
  const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate"));
  return JSON.parse(await new Response(stream).text());
}

function prepare(data) {
  HEAVY = data;
  FN = data.functions.map(f => ({module: f[0], name: f[1], kind: f[2], doc: f[3], line: f[4], end: f[5], calls: f[6], text: f[7]}));
  FN.forEach((f, i) => FN_BY_KEY[MODULES[f.module].name + "/" + f.name] = i);
  CALLED_BY = FN.map(() => []);
  FN.forEach((f, i) => f.calls.forEach(c => CALLED_BY[c[0]].push([i, c[1]])));
  IMPORTED_BY = MODULES.map(() => []);
  data.imports.forEach((targets, i) => targets.forEach(t => IMPORTED_BY[t].push(i)));
  MOD_FUNCS = MODULES.map(() => []);
  FN.forEach((f, i) => MOD_FUNCS[f.module].push(i));
  SOURCES = data.sources;
}

function lines(moduleIndex) {
  if (!SRC_LINES[moduleIndex]) SRC_LINES[moduleIndex] = (SOURCES[moduleIndex] || "").split("\n");
  return SRC_LINES[moduleIndex];
}

function source(moduleIndex, from, to) {
  const all = lines(moduleIndex), out = [];
  for (let n = from; n <= to && n <= all.length; n++)
    out.push(`<span class="ln">${n}</span>${esc(all[n - 1])}`);
  return `<pre class="src">${out.join("\n")}</pre>`;
}

// -- level 1: the project map ------------------------------------------------------------------------------------

const LAYERS = [["cli", "web", "api", "admin"], ["queue", "backup", "wiki", "describe", "generation", "population"],
                ["galaxy", "db", "names"], ["physics", "util", "tuning", "package"]];

function areaEdges() {
  const counts = {};
  HEAVY.imports.forEach((targets, i) => targets.forEach(t => {
    const a = MODULES[i].area, b = MODULES[t].area;
    if (a === b || a === "tests") return;
    const key = a + ">" + b;
    (counts[key] = counts[key] || []).push([i, t]);
  }));
  return counts;
}

function renderMap() {
  const areaFns = {}; FN.forEach(f => areaFns[MODULES[f.module].area] = (areaFns[MODULES[f.module].area] || 0) + 1);
  const W = 1040, boxW = 168, boxH = 54, top = 30, gap = 92;
  const pos = {};
  LAYERS.forEach((layer, row) => {
    const present = layer.filter(k => AREA_BY_KEY[k]);
    const step = W / present.length;
    present.forEach((k, n) => pos[k] = [step * n + (step - boxW) / 2, top + row * (boxH + gap)]);
  });
  const edges = areaEdges(), parts = [];
  Object.keys(edges).forEach(key => {
    const [a, b] = key.split(">");
    if (!pos[a] || !pos[b]) return;
    const x1 = pos[a][0] + boxW / 2, y1 = pos[a][1] + boxH, x2 = pos[b][0] + boxW / 2, y2 = pos[b][1];
    const n = edges[key].length, width = 0.8 + Math.log2(n + 1) * 0.55;
    const down = pos[b][1] >= pos[a][1];
    const sy = down ? y1 : pos[a][1], ey = down ? y2 : pos[b][1] + boxH;
    const mid = (sy + ey) / 2;
    parts.push(`<path class="edge${n >= 12 ? " strong" : ""}" data-edge="${key}" data-from="${a}" data-to="${b}" stroke-width="${width.toFixed(2)}" d="M${x1},${sy} C${x1},${mid} ${x2},${mid} ${x2},${ey}"><title>${a} imports ${b}: ${n} import${n === 1 ? "" : "s"} (click to list)</title></path>`);
  });
  AREAS.forEach(a => {
    if (!pos[a.key]) return;
    const [x, y] = pos[a.key];
    parts.push(`<g data-area="${a.key}"><a href="#/area/${a.key}"><rect class="box" x="${x}" y="${y}" width="${boxW}" height="${boxH}" rx="8"></rect>` +
      `<text x="${x + 12}" y="${y + 23}">${esc(a.key)}</text><text class="sub" x="${x + 12}" y="${y + 41}">${a.modules.length} modules, ${areaFns[a.key] || 0} fns</text></a></g>`);
  });
  const height = top + LAYERS.length * (boxH + gap);
  const cards = AREAS.map(a => `<div class="card"><b><a href="#/area/${a.key}">${esc(a.key)}</a></b>${esc(a.purpose || "")}` +
    `<small>${a.modules.length} modules${areaFns[a.key] ? ", " + areaFns[a.key] + " functions and classes" : ""}</small></div>`).join("");
  app.innerHTML = `<h2>Project map</h2><p class="lead">The areas of <code>src/planetgen</code> (the first folder under it) and the imports between them: a line runs from the area that imports to the area it imports, thicker for more imports. Point at an area to light its lines (orange: what it imports, blue: what imports it); click an area to see its modules, a line to see which modules make it. ` +
    `The tests import nearly everything and are not drawn.</p>` +
    `<svg viewBox="0 0 ${W} ${height}" role="img" aria-label="Areas of the project and the imports between them">${parts.join("")}</svg>` +
    `<div id="edge-detail"></div><h3>The areas</h3><div class="cards">${cards}</div>` +
    `<h3>Flows</h3><p>The main paths end to end, traced from their entry functions through the calls the code makes: <a href="#/flow">open the flow view</a>.</p>`;
  app.querySelectorAll("path[data-edge]").forEach(p => p.addEventListener("click", () => showEdge(p.dataset.edge, edges[p.dataset.edge])));
  const svg = app.querySelector("svg");
  app.querySelectorAll("g[data-area]").forEach(g => {
    g.addEventListener("mouseenter", () => {
      svg.classList.add("focus");
      svg.querySelectorAll("path.edge").forEach(p => {
        p.classList.toggle("out", p.dataset.from === g.dataset.area);
        p.classList.toggle("in", p.dataset.to === g.dataset.area);
      });
    });
    g.addEventListener("mouseleave", () => svg.classList.remove("focus"));
  });
}

function showEdge(key, pairs) {
  const [a, b] = key.split(">");
  const rows = pairs.map(([i, t]) => `<li>${modLink(i)} <span class="where">imports</span> ${modLink(t)}</li>`).join("");
  document.getElementById("edge-detail").innerHTML = `<h3>${esc(a)} imports ${esc(b)} (${pairs.length})</h3><ul class="edges">${rows}</ul>`;
}

// -- level 2: an area -------------------------------------------------------------------------------------------

function renderArea(key) {
  const area = AREA_BY_KEY[key];
  if (!area) return notFound(`No area ${key}`);
  const rows = area.modules.map(i => {
    const outs = HEAVY.imports[i], ins = IMPORTED_BY[i];
    const list = ids => ids.length ? ids.map(modLink).join(", ") : "<span class=muted>none</span>";
    return `<tr><td><a href="#/mod/${MODULES[i].name}">${esc(short(MODULES[i].name))}</a><br><span class="muted">${esc(MODULES[i].doc)}</span></td>` +
      `<td class="num">${MOD_FUNCS[i].length}</td>` +
      `<td><details><summary>${outs.length} imports</summary>${list(outs)}</details></td>` +
      `<td><details><summary>${ins.length} imported by</summary>${list(ins)}</details></td></tr>`;
  }).join("");
  app.innerHTML = `<div class="crumbs"><a href="#/">Project map</a> / ${esc(key)}</div><h2>${esc(key)}</h2><p class="lead">${esc(area.purpose || "")}</p>` +
    `<table><thead><tr><th>Module</th><th class="num">Functions</th><th>Imports</th><th>Imported by</th></tr></thead><tbody>${rows}</tbody></table>`;
}

// -- level 3: a module ------------------------------------------------------------------------------------------

function callList(calls) {
  if (!calls.length) return "<span class=muted>none resolved</span>";
  return `<ul class="edges">${calls.map(c => `<li>${fnFull(c[0])}${c[1] ? '<span class="badge probable" title="Resolved because it is the only function with this name in the project">probable</span>' : ""}</li>`).join("")}</ul>`;
}

function renderModule(name) {
  const i = MODULE_BY_NAME[name];
  if (i === undefined) return notFound(`No module ${name}`);
  const m = MODULES[i], funcs = MOD_FUNCS[i];
  const importLinks = ids => ids.length ? ids.map(modLink).join(", ") : "<span class=muted>none</span>";
  const rows = funcs.map(f => `<tr><td>${fnLink(f)}<span class="badge kind">${FN[f].kind}</span><br><span class="muted">${esc(FN[f].doc)}</span></td>` +
    `<td class="num">${FN[f].calls.length}</td><td class="num">${CALLED_BY[f].length}</td></tr>`).join("");
  const isTest = m.area === "tests";
  app.innerHTML = `<div class="crumbs"><a href="#/">Project map</a> / <a href="#/area/${m.area}">${esc(m.area)}</a> / ${esc(short(m.name))}</div>` +
    `<h2>${esc(short(m.name))}</h2><p class="lead">${esc(m.doc)}</p>` +
    `<div class="cols"><div><h3>Imports</h3>${importLinks(HEAVY.imports[i])}</div><div><h3>Imported by</h3>${importLinks(IMPORTED_BY[i])}</div></div>` +
    (isTest ? `<p class="muted">Test modules are mapped at module level only.</p>` :
      `<h3>Classes and functions (${funcs.length})</h3>` + (funcs.length ? `<table><thead><tr><th>Name</th><th class="num">Calls</th><th class="num">Called by</th></tr></thead><tbody>${rows}</tbody></table>` : `<p class="muted">Nothing defined at the top level.</p>`) +
      `<details style="margin-top:14px"><summary>Module source</summary>${source(i, 1, lines(i).length)}</details>`);
}

// -- level 4: a function ----------------------------------------------------------------------------------------

function renderFunction(module, name) {
  const idx = FN_BY_KEY[module + "/" + name];
  if (idx === undefined) return notFound(`No function ${name} in ${module}`);
  const f = FN[idx], mi = f.module, m = MODULES[mi];
  const calledBy = CALLED_BY[idx].filter(c => true);
  const unres = f.text.length ? `<ul class="unres">${f.text.map(t => `<li>${esc(t)}</li>`).join("")}</ul>` : "<span class=muted>none</span>";
  const members = f.kind === "class" ? MOD_FUNCS[mi].filter(j => FN[j].name.startsWith(f.name + ".")) : [];
  app.innerHTML = `<div class="crumbs"><a href="#/">Project map</a> / <a href="#/area/${m.area}">${esc(m.area)}</a> / <a href="#/mod/${m.name}">${esc(short(m.name))}</a> / ${esc(f.name)}</div>` +
    `<h2>${esc(f.name)} <span class="badge kind">${f.kind}</span></h2><p class="lead">${esc(f.doc)}</p>` +
    `<p class="muted mono">${esc(m.name.replace(/\./g, "/"))}.py lines ${f.line} to ${f.end}</p>` +
    (members.length ? `<h3>Methods</h3><ul class="edges">${members.map(j => `<li>${fnLink(j)}</li>`).join("")}</ul>` : "") +
    `<div class="cols"><div><h3>Calls (${f.calls.length})</h3>${callList(f.calls)}<h3>Unresolved calls (${f.text.length})</h3>` +
    `<p class="muted">Calls the map could not place: a method on a value of unknown type, a library or a dynamic call.</p>${unres}</div>` +
    `<div><h3>Called by (${calledBy.length})</h3>${calledBy.length ? `<ul class="edges">${calledBy.map(c => `<li>${fnFull(c[0])}${c[1] ? '<span class="badge probable">probable</span>' : ""}</li>`).join("")}</ul>` : "<span class=muted>nothing resolved calls it (an entry point, a route, a test or a dynamic call)</span>"}</div></div>` +
    `<h3>Source</h3>${source(mi, f.line, f.end)}`;
}

// -- the flows --------------------------------------------------------------------------------------------------

function treeNode(idx, depth, ancestors) {
  const li = document.createElement("li");
  const f = FN[idx], kids = f.calls.filter(c => !c[1]);
  const seen = ancestors.has(idx);
  const label = `${fnFull(idx)}`;
  if (seen) { li.innerHTML = `${label} <span class="muted">(already above)</span>`; return li; }
  if (!kids.length || depth >= HEAVY.depth) {
    li.innerHTML = label + (kids.length ? ` <span class="muted">(${kids.length} calls: open it to continue)</span>` : "");
    return li;
  }
  const d = document.createElement("details");
  d.innerHTML = `<summary>${label} <span class="muted">(${kids.length})</span></summary>`;
  let built = false;
  d.addEventListener("toggle", () => {
    if (!d.open || built) return; built = true;
    const ul = document.createElement("ul"); ul.className = "tree";
    const next = new Set(ancestors); next.add(idx);
    kids.forEach(c => ul.appendChild(treeNode(c[0], depth + 1, next)));
    d.appendChild(ul);
  });
  li.appendChild(d);
  return li;
}

function renderFlows(key) {
  const shown = key ? HEAVY.flows.filter(f => f.key === key) : HEAVY.flows;
  if (key && !shown.length) return notFound(`No flow ${key}`);
  app.innerHTML = `<div class="crumbs"><a href="#/">Project map</a> / <a href="#/flow">Flows</a>${key ? " / " + esc(key) : ""}</div><h2>Flows</h2>` +
    `<p class="lead">Each flow starts at the entry functions named in the generator (<code>FLOWS</code> in <code>scripts/build_architecture_map.py</code>) and follows the calls the code makes, ${HEAVY.depth} deep; open a step to see what it calls, click a name to open the function. Only resolved calls are followed (unresolved and probable ones are on each function's page).</p>`;
  shown.forEach(flow => {
    const sec = document.createElement("section");
    sec.innerHTML = `<h3 id="${flow.key}"><a href="#/flow/${flow.key}">${esc(flow.title)}</a></h3><p>${esc(flow.text)}</p>`;
    const ul = document.createElement("ul"); ul.className = "tree";
    flow.entries.forEach(e => ul.appendChild(treeNode(e, 0, new Set())));
    sec.appendChild(ul);
    app.appendChild(sec);
  });
}

function notFound(text) { app.innerHTML = `<h2>Not found</h2><p>${esc(text)}. <a href="#/">Back to the project map.</a></p>`; }

// -- routing and search -----------------------------------------------------------------------------------------

function route() {
  document.getElementById("results").style.display = "none";
  const parts = decodeURIComponent(location.hash.replace(/^#\/?/, "")).split("/");
  if (!HEAVY) { app.innerHTML = '<div class="loading">Reading the code map...</div>'; return; }
  window.scrollTo(0, 0);
  if (!parts[0]) renderMap();
  else if (parts[0] === "area") renderArea(parts[1]);
  else if (parts[0] === "mod") renderModule(parts[1]);
  else if (parts[0] === "fn") renderFunction(parts[1], parts.slice(2).join("/"));
  else if (parts[0] === "flow") renderFlows(parts[1]);
  else notFound("No such view");
}

const search = document.getElementById("search"), results = document.getElementById("results");
search.addEventListener("input", () => {
  const q = search.value.trim().toLowerCase();
  if (q.length < 2 || !HEAVY) { results.style.display = "none"; return; }
  const found = [];
  for (let i = 0; i < MODULES.length && found.length < 60; i++)
    if (MODULES[i].name.toLowerCase().includes(q)) found.push(`<a href="#/mod/${MODULES[i].name}">module ${esc(short(MODULES[i].name))}</a>`);
  for (let i = 0; i < FN.length && found.length < 60; i++)
    if (FN[i].name.toLowerCase().includes(q)) found.push(`<a href="${fnHref(i)}">${esc(FN[i].name)} <span class="muted">${esc(short(MODULES[FN[i].module].name))}</span></a>`);
  results.innerHTML = found.length ? found.join("") : '<span class="none">Nothing matches.</span>';
  results.style.display = "block";
});
search.addEventListener("keydown", e => {
  if (e.key === "Enter") { const a = results.querySelector("a"); if (a) { location.hash = a.getAttribute("href"); search.blur(); } }
  if (e.key === "Escape") { results.style.display = "none"; }
});
document.addEventListener("click", e => { if (!results.contains(e.target) && e.target !== search) results.style.display = "none"; });
window.addEventListener("hashchange", route);

inflate(document.getElementById("heavy").textContent.trim()).then(data => { prepare(data); route(); document.body.dataset.ready = "1"; })
  .catch(err => { app.innerHTML = `<h2>The code map could not be read</h2><p>${esc(err)}. The page needs a browser with DecompressionStream (any current one).</p>`; });
</script>
