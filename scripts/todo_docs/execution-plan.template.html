<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>planetGen Execution Plan</title>
<meta name="description" content="The intergalactic space plan: six lanes of work, the order the stages run in and the open items under each; for the people running the lanes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: where each lane is, the headline panel, open items by version, the goal issues, conflicts and open questions, then older decisions. Generated by scripts/build_todo_docs.py (DOC.68) from docs/TODO.md, docs/plan/lanes.md and docs/plan/execution-notes.md: do not edit by hand. */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --sunk:#E9EDF3; --ink:#152030; --muted:#566275; --line:#D8DEE7;
  --accent:#B05E0C; --accent-soft:#F6E7D6; --ground:#0E7682; --ground-soft:#D8EEF0;
  --bug:#B3261E; --bug-soft:#F8DEDB; --new:#3F5BB0; --new-soft:#E1E7F8;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1118; --surface:#141B25; --sunk:#1A2330; --ink:#E5EAF1; --muted:#97A3B5; --line:#273244;
  --accent:#E7A05A; --accent-soft:#3A2814; --ground:#55C3CC; --ground-soft:#12313A;
  --bug:#F2786E; --bug-soft:#3D1A18; --new:#93A9F0; --new-soft:#1D2747; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1118; --surface:#141B25; --sunk:#1A2330; --ink:#E5EAF1; --muted:#97A3B5; --line:#273244;
  --accent:#E7A05A; --accent-soft:#3A2814; --ground:#55C3CC; --ground-soft:#12313A;
  --bug:#F2786E; --bug-soft:#3D1A18; --new:#93A9F0; --new-soft:#1D2747; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-body);margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:28px 80px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(2rem,4.5vw,2.9rem);font-weight:700;letter-spacing:-.01em}
h2{font-size:1.5rem;font-weight:700;margin-top:44px}
h3{font-size:1.05rem;font-weight:700;margin-top:20px}
p{max-width:76ch}
code,.mono{font-family:var(--f-mono);font-size:.84em}
a{color:var(--accent)}
.eyebrow{font:600 .74rem/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lede{color:var(--muted);margin:.6rem 0 0}
.order{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 0;padding:0;list-style:none}
.order li{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.order li b{font-family:var(--f-display);font-size:1.05rem}
.order li span{color:var(--muted);font-size:.84rem}
.order li.last{border-style:dashed}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-top:12px}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;vertical-align:top;padding:9px 12px;border-bottom:1px solid var(--line)}
th{font:600 .72rem/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--sunk);position:sticky;top:0}
tr:last-child td{border-bottom:0}
td.k{font:600 .8rem/1.3 var(--f-mono);color:var(--ground);white-space:nowrap}
.lanes td,.lanes th{min-width:190px}
.lanes td.k,.lanes th.k{min-width:90px}
.id{font:600 .8rem/1.3 var(--f-mono);color:var(--ground);white-space:nowrap}
.bug{font:600 .66rem/1 var(--f-mono);text-transform:uppercase;padding:2px 5px;border-radius:5px;background:var(--bug-soft);color:var(--bug)}
.flag{font:600 .66rem/1 var(--f-mono);text-transform:uppercase;padding:2px 5px;border-radius:5px;background:var(--accent-soft);color:var(--accent)}
.blk{font:600 .66rem/1 var(--f-mono);text-transform:uppercase;padding:2px 5px;border-radius:5px;background:var(--ground-soft);color:var(--ground)}
.later{font:600 .66rem/1 var(--f-mono);text-transform:uppercase;padding:2px 5px;border-radius:5px;background:var(--new-soft);color:var(--new)}
ul.tight{margin:.4rem 0 0;padding-left:1.2rem;max-width:80ch}
ul.tight li{margin:.2rem 0}
.group{margin-top:26px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 18px 18px}
.group h3{margin-top:14px}
.muted{color:var(--muted)}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:20px}
.split>div,.split>*{min-width:0}
ol.tight{padding-left:1.4rem}
.note{background:var(--accent-soft);border-radius:10px;padding:10px 14px;margin-top:14px;max-width:84ch}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:520px){th,td{padding:8px}}
.chips{display:flex;flex-wrap:wrap;gap:4px 10px}
a.id{text-decoration:none;border-bottom:1px dotted var(--ground)}
details.hist{margin-top:10px}details.hist>summary{cursor:pointer;font-weight:600}
</style>
<body>
<div class="wrap">
__BODY__
</div>
</body>
</html>
