s: \"We'll use SMTP for\nemail which means admin config needs SMTP settings.\" Done: SMTP host,\nport, security (STARTTLS or TLS), username, password and From address,\nset from an admin page (and the config file/installer), with a \"send\ntest email\" button; one small mail module that every flow in USR.4\nto USR.6 uses, which logs failures and never shows the SMTP\npassword. Open questions: is the SMTP password kept in the config\nfile (like the database password) or in the control database, and is\nit encrypted there? Who can change SMTP settings: any admin, or only\nthe Owner? What do invites and resets do when SMTP isn't configured\n(show the link to the admin to pass on by hand?)?", "thread": "Accounts", "title": "SMTP settings in the admin config", "unblocks": ["GEN.111", "USR.1", "USR.4", "USR.5"], "was": ""}, "USR.4": {"bug": false, "deps": ["USR.2", "USR.3"], "id": "USR.4", "note": "", "phase": "3+", "text": "Boss: \"only an admin can\ninvite a user which is done by unique link, admin can select how many\nuses the link has or if it expires in 1 hour, 4, 6, 12, 24, 3 days, 7\ndays, 1 month, 1 year, or never. Likewise invite # of uses the link\ngets can be infinite but infinite and never expire in combo ask for\nconfirmation as this is not recommended.\" Done: an admin page that\ncreates invite links (a random token stored hashed, like session\ntokens) with a use count (a number, or infinite) and one of the\nexpiry choices above; infinite uses together with never expires asks\nthe admin to confirm and says it isn't recommended; a list of invites\nwith uses left, expiry and who made them, and a way to revoke one;\nopening a valid link lets someone register (username, email), then\nUSR.5's email loop sets their password; the account is a user, not\nan admin. Open questions: does an admin optionally type the invitee's\nemail so the link is sent for them, or only copy the link? Is the\ninvite page rate-limited, and is there a cap on open invites? Does\na multi-use link record who used it?", "thread": "Accounts", "title": "Invite-only sign-up by unique link", "unblocks": ["USR.1"], "was": ""}, "USR.5": {"bug": false, "deps": ["USR.3"], "id": "USR.5", "note": "", "phase": "3+", "text": "Boss: \"an\nemail loop for password setting / resetting\". Done: a new account\nsets its first password from an emailed link; \"forgot password\" on\nthe login page emails a reset link; links are single-use, short-lived\n(stored hashed) and end the account's other sessions once used; the\npage never says whether an email address has an account; resets are\nrate-limited per address and per IP alongside the existing login\nbackoff and SEC.1. Open questions: how long a reset link lasts\n(30 minutes? 1 hour?); does changing the email address also need an\nemail confirmation to the old and new addresses; does the Owner's\nreset need anything extra?", "thread": "Accounts", "title": "Email loop for setting and resetting passwords", "unblocks": ["USR.1", "USR.6"], "was": ""}, "USR.6": {"bug": false, "deps": ["USR.5"], "id": "USR.6", "note": "", "phase": "3+", "text": "Boss: \"The owner CAN (with specific approval\nand double password confirmation and email loop confirmation) assign\nowner to someone else who then has to accept via email loop.\" Done:\nonly the Owner can start a transfer, from a page that asks them to\nconfirm the choice explicitly, enter their password twice, and then\nconfirm from an email link; the chosen account then gets an email and\nmust accept from its own link; only when both are done does Owner\nmove; every step goes to the audit log. Open questions: what the old\nOwner becomes (admin?); does the new Owner have to be an admin\nalready; how long the pending transfer lasts and whether the Owner\ncan cancel it; what happens if the Owner loses their email or\npassword (recovery from the server's command line?).", "thread": "Accounts", "title": "Owner transfer", "unblocks": ["USR.1"], "was": ""}, "USR.7": {"bug": false, "deps": ["USR.2"], "id": "USR.7", "note": "Bookmarks of any object use NAV.7 references.", "phase": "3+", "text": "Boss: \"a full user\nlevel interface to allow users to bookmark\". Done: signed-in users\n(any role) get an account page and can bookmark sectors, systems,\nplanets, phenomena and NAV courses, see them in a list, name them and\nremove them; bookmarks are stored per account in the control\ndatabase. Open questions: which objects can be bookmarked, and can\nusers also add notes? What else a user can do that an anonymous\nvisitor can't (is the site still public to read, or sign-in only?)?\nDo bookmarks survive a galaxy regenerate (object ids change), and if\nnot, what does a broken bookmark show? Per-browser bookmarks\n(`static/bookmarks.js`, MAP.23) shipped in PR #234; storing them in\nthe database still needs decision 4 of the drill-down design and a\nmigration.", "thread": "Accounts", "title": "A user-level interface with bookmarks", "unblocks": ["NAV.19", "USR.1"], "was": ""}, "USR.8": {"bug": false, "deps": ["USR.2"], "id": "USR.8", "note": "Boss 05:16Z. Today /admin/generate/system is admin-only and only admin accounts exist, so no earlier step is needed. Open question: per-user limit (default 30 an hour, admins unlimited).", "phase": "3+", "text": "Boss (2026-10-02 05:16Z): \"TODO Item, all users can generate a\none-off system, but you have to be logged in.\" Checked on main: the\none-off system page (`/admin/generate/system` and its `/download`,\n`html/web/system_page.py`) is admins only (`_admin_or_redirect` /\n`_admin_or_403` from `generate_page.py`), and the only accounts\ntoday are admin accounts, so anonymous visitors already can't use it\nand nothing needs changing until user accounts exist. Done: once\nUSR.2 adds the user role, any signed-in account (user, admin or\nOwner) can open the one-off page from a link outside the admin menu\n(for example `/generate/system`, with the old admin URL\nredirecting), with the same options and output; it still never saves\nto the database; anonymous visitors are sent to sign in; the rest of\n`/admin/generate` stays admin-only; a test covers anonymous, user\nand admin. Open question for Boss, with the default taken: a\nper-user limit, since each system runs the generator in a separate\nprocess for about a second (default: 30 one-off systems per hour per\nuser account, admins and the Owner unlimited, a clear message when\nthe limit is reached, the count kept in the control database).\nPrerequisite: USR.2.", "thread": "Accounts", "title": "Every signed-in user can generate a one-off system", "unblocks": [], "was": ""}, "UX.22": {"bug": false, "deps": ["UX.23"], "id": "UX.22", "note": "One quantity family per PR.", "phase": "1", "text": "Boss (2026-10-01 15:10Z): \"standardize ALL measurements into trees\nlike we have so that we always have meaningful units. From mass, to\ndistance, to time, to speed, just everything that can have units.\nAtmospheric pressure and surface conditions should show customary\nunits as well as a secondary to help contextualize the metric values\ngiven.\" Today only distance has a ladder (`format_distance_m` and\nfriends in `stellarObjects/utils.py` and `html/lib/fmt.py`, mirrored\nby `static/distance.js`), speed (UX.13: `format_speed_kms`,\n`static/speed.js`) and durations (UX.14: `format_duration_seconds`,\n`format_period_years`, `static/period.js`). Done: one ladder per quantity, in Python with a JavaScript\nmirror, picking a meaningful unit the same way, and every page, map\npanel and form converted to it: mass (kg, Earth, Jupiter and solar\nmasses), distance, time, speed, temperature, pressure, gravity,\ndensity, luminosity, power and any other quantity shown with a unit.\nSurface conditions show temperature in K, °C and °F; atmospheric\npressure and the other surface conditions show a customary unit\n(such as atm, psi or g) beside the metric value. Surface\ntemperature (K, °C, °F) and pressure (kPa, atm, psi) shipped in PR\n#234; this item covers the rest. Open questions: the ladder and switch\npoints for each quantity; which customary unit goes with each surface\ncondition; whether the secondary unit shows in tables or only in\ndetail panels.", "thread": "Pages", "title": "Meaningful units for every measurement", "unblocks": ["UX.30"], "was": ""}, "UX.23": {"bug": false, "deps": [], "id": "UX.23", "note": "The ladder uses astropy.units. 22 (a feature); UX.36 keeps today's formatter and needs no ladder. Shared unit ladder; UX.22 then UX.30 build on it.", "phase": "1", "text": "Done: one Python ladder module (in `stellarObjects/utils.py` or a new\n`units.py`) and its JavaScript twin, generalising the existing\ndistance, speed and duration ladders, with a test that the Python and\nJavaScript twins agree for a table of values. Then one sub-item per\nquantity family: mass; temperature; pressure and gravity; density,\nluminosity and power.\nPlan (2026-10-07): The ladder is built on astropy.units (GEN.66).", "thread": "Pages", "title": "A shared unit-ladder module", "unblocks": ["UX.22"], "was": ""}, "UX.3": {"bug": false, "deps": [], "id": "UX.3", "note": "ETA from the RQ job's published progress. ETA from progress.json, which PERF.23 caps.", "phase": "1", "text": "Boss (2026-10-01): \"a warning to all users on the UI when a\ntask is running in the background which is modifying the starmap is\ngoing on with an ETA until it will be finished to the nearest hour\nrounding up.\" Today only the admin Generate page shows a running job\n(`web/jobs.py`: the `active` lock in the jobs directory, each job's\n`state.json`, and `progress.json` written by `generate.py` through\n`stellarObjects.progressFile`). Done: while a job that writes to the\ngalaxy is running (plan, bright-star scatter, sector fill, block and\nneighborhood generation from the map (MAP.20), reset, new galaxy,\nand later ADM.8's regenerate), every page shows a banner to every\nvisitor, signed in or not, saying the galaxy is being changed and\nwhen it should finish, as an ETA rounded up to the next whole hour\n(from `progress.json`, and from PERF.3's measured stars-per-second\nrate). Open questions: a banner at the top of every page, or only on\nthe map and list pages? Does it also cover `generate.py` runs started\nfrom the command line, which don't take the web jobs lock today\n(they would need to write the same lock and progress file)? What does\nit say when there's no ETA yet?\nPlan (2026-10-07): The banner reads the RQ job's published progress\n(ADM.22), not progress.json.", "thread": "Pages", "title": "Warn every visitor while a background job changes the galaxy", "unblocks": [], "was": ""}, "UX.30": {"bug": false, "deps": ["UX.22", "UX.32"], "id": "UX.30", "note": "Uses the unit ladders; shows the composition rows DB.2 now reads (PR #347).", "phase": "2", "text": "Boss (2026-10-01 23:53Z): \"Rework planet information displays to pull\naway from the markdown render and instead fits with the modern web UI\nas we've seen it so far.\" Today each body's expanded row on the\nsystem page is the generator's Markdown (`systemRender.render_system_sections`)\nturned into HTML by `lib/mdrender.py` (`systempage._row_html`), and\nso is the system overview; only the stat chips are built as HTML.\nDone: the system page builds each body's details from its stored\nvalues as structured HTML (property grids, atmosphere composition\nbars, orbit figures, moons, life), styled like the rest of the site in\nboth themes and every size class, using the unit ladders (UX.22);\n`mdconvert` is no longer used for them. The wikitext and Markdown\nviews (the Wikitext/Markdown toggle and wiki upload) keep using the\ntext render. Open question: does the overview text stay as prose?", "thread": "Pages", "title": "Planet information without the Markdown render", "unblocks": [], "was": ""}, "UX.32": {"bug": false, "deps": [], "id": "UX.32", "note": "Same rows as UX.30; one thread.", "phase": "2", "text": "Boss (2026-10-01 23:53Z): \"Remove type of planet (Terrestrial / gas)\nand moon from the row display just giving class instead of class and\ntype.\" Today each planet row's chips (`systempage.py`, around line\n215) are \"Class X\", a type chip (\"Terrestrial\" or \"Gas Giant\" from\n`_type_chip`, or \"Habitable\"), optional \"Habitable moon\" and\n\"Inhabited\", then distance, period and gravity, and moons sit in a\n\"N moons of X\" group under the row. Done: the row shows the class\n(linked to its reference page) and no Terrestrial/Gas Giant chip or\nmoon label; the moons stay reachable from a small count on the row.\nOpen question: does \"Habitable\" stay as a chip?", "thread": "Pages", "title": "Planet rows show the class only, without the type and moon labels", "unblocks": ["UX.30"], "was": ""}, "UX.35": {"bug": false, "deps": [], "id": "UX.35", "note": "In parallel with NAV.12; replaces ol.nav-route in nav.html.", "phase": "1", "text": "Boss (2026-10-02 01:53Z): \"display the path horizontally and find a\nway to split it between multiple lines for mobile or limited\ndisplays.\" Today the route is a vertical list (`<ol class=\"nav-route\">`\nin `nav.html`). Done: the stops run left to right, each a link, with\nthe hop distance between them; on phones and narrow panels it wraps\nonto several lines (a container query, not a device check), never\nsplitting a stop across lines; screen readers still get an ordered\nlist. Runs alongside NAV.12; NAV.36 styles its unknown-space hops.\nDesign: [docs/design/course-routing.md](design/course-routing.md)", "thread": "Routing", "title": "The NAV page route shown horizontally, wrapping onto several lines on narrow screens", "unblocks": ["NAV.36", "NAV.42"], "was": ""}, "UX.42": {"bug": false, "deps": [], "id": "UX.42", "note": "After the UX sweep removes controls, so only kept wording is changed.", "phase": "1", "text": "Boss (2026-10-03 05:38Z): \"Begin replacing wording to make the\ninterface in-universe (i.e. the interface and wording should not be\ndesigned so they sound like they know it's for a game).\" Done: a word\nlist (for example \"Generate\" becomes \"Chart\", \"Generated only\" became\n\"Charted only\" in MAP item MAP.111) agreed with Boss, then pages,\nbuttons and messages changed page by page; admin-only tools may keep\nplain wording.", "thread": "Pages", "title": "In-universe wording across the interface", "unblocks": ["UX.43"], "was": ""}, "UX.43": {"bug": false, "deps": ["UX.42"], "id": "UX.43", "note": "", "phase": "2", "text": "Boss (2026-10-07 11:47Z): \"All design elements should be built from\nthe ground up to look like, as much as possible, a starmap and\nnavigational system that a space pilot might use.\" Done: a design\nbrief (colours, type, panel shapes, iconography) approved by Boss,\nthen the base template and shared components restyled to it in both\nthemes, with contrast and reduced motion kept.\nPrerequisite: UX.42.", "thread": "Pages", "title": "A visual design built like a pilot's starmap and navigation console", "unblocks": [], "was": ""}, "UX.45": {"bug": false, "deps": ["UX.46", "UX.47", "UX.48"], "id": "UX.45", "note": "Parent; per browser until accounts (USR.7) move them.", "phase": "2", "text": "Boss (2026-10-07 11:47Z): \"Bookmark management system.\" Today\nbookmarks are kept per browser by `bookmarks.js` (NAV.40). Done when\nits subitems are.\nPrerequisites: UX.46, UX.47, UX.48.", "thread": "Bookmarks", "title": "Bookmark management", "unblocks": [], "was": ""}, "UX.46": {"bug": false, "deps": [], "id": "UX.46", "note": "", "phase": "1", "text": "Boss (2026-10-07 11:47Z): \"When a galaxy is wiped all bookmarks are\nwiped too.\" Done: bookmarks are stamped with the galaxy seed, and a\npage load that finds bookmarks for another seed (after a reset or\nnew galaxy) drops them; a test covers it.", "thread": "Bookmarks", "title": "Wiping the galaxy wipes the bookmarks", "unblocks": ["UX.45", "UX.47"], "was": ""}, "UX.47": {"bug": false, "deps": ["UX.46"], "id": "UX.47", "note": "", "phase": "1", "text": "Done: a Bookmarks page listing every bookmark with its kind and\nplace, where each can be renamed, grouped, sorted, opened on its map\nand deleted, and the list can be exported and imported as a file.\nPrerequisite: UX.46.", "thread": "Bookmarks", "title": "A bookmark manager: list, rename, sort, group and delete", "unblocks": ["UX.45", "UX.48"], "was": ""}, "UX.48": {"bug": false, "deps": ["UX.47"], "id": "UX.48", "note": "", "phase": "2", "text": "Boss (2026-10-07 11:47Z): \"Clusters of contiguous generated content\ngets added to a system bookmark which will zoom in as close as it\ncan to see all sectors in the group and highlight the shape of the\nregion specifically.\" Done: every contiguous group of charted\nsectors gets a system bookmark (kept up to date as sectors are\ncharted) that opens the Galaxy Map fitted to the group with its\noutline highlighted.\nPrerequisite: UX.47.", "thread": "Bookmarks", "title": "Charted regions as bookmarks that frame and outline the region", "unblocks": ["UX.45"], "was": ""}, "UX.49": {"bug": false, "deps": [], "id": "UX.49", "note": "Follows UX.40 (done): the fields themselves become Shoelace components.", "phase": "1", "text": "UX.40 (done, PRs #528, #533, #539, #544) moved the buttons, menus and\ndialogs onto Shoelace and lined up the Generate page's text boxes with\nplain CSS; the form fields themselves are still native `<input>`,\n`<select>` and checkbox elements. Done: every text box, number box,\ndrop-down and checkbox in the templates (Generate and one-off system\npages, the edit dialogs, the search and filter fields, sign-in and\naccount forms, admin pages) is an `sl-input`, `sl-select` or\n`sl-checkbox` from the vendored set, submitting and validating\nexactly as before (labels, required fields, keyboard use, values\nposted by name), both themes and phone widths look right, and a\nbrowser test fills and submits one form of each kind. Not a bug.\nPrerequisites: none.\nDesign: [docs/design/library-migration.md](design/library-migration.md)", "thread": "Bookmarks", "title": "Form fields as Shoelace components (sl-input, sl-select, sl-checkbox) across the site", "unblocks": [], "was": ""}, "UX.76": {"bug": true, "deps": [], "id": "UX.76", "note": "GitHub issue [#706](https://github.com/dwhagar/planetGen/issues/706).", "phase": "1", "text": "Boss (GitHub issue [#706](https://github.com/dwhagar/planetGen/issues/706), 2026-10-09 00:13Z): \"Make sure to adapt your\nicons for dark or light mode, same with highlights and such. Some of\nthe buttons highlight dark with dark text and the new icons are dark\nin dark mode.\" Done: every icon, and every button state (hover, focus,\npressed, selected), reads against its background in both themes; icons\ntake their colour from the theme (currentColor) instead of a fixed\nfill; a browser test opens the main pages in both themes and checks\ntext at 4.5:1 and icons at 3:1 against their backgrounds.", "thread": "Bugs from the GitHub issues", "title": "Icons and highlights follow the light and dark theme (bug)", "unblocks": [], "was": ""}, "VIEW.1": {"bug": false, "deps": [], "id": "VIEW.1", "note": "Research session with Boss.", "phase": "3+", "text": "**Research first.** Boss: \"view-from-planet will have to do\ncalculations on colors and A LOT Of stuff, so make special note of\nthat, it will need a full research pass.\" Before any code for VIEW.2\nand VIEW.3, Boss wants a research session with him \"into exactly how\none would do that\". VIEW.2 and VIEW.3 are blocked on it; VIEW.4\nis not.", "thread": "View", "title": "View from a planet", "unblocks": ["VIEW.2"], "was": ""}, "VIEW.2": {"bug": false, "deps": ["VIEW.1"], "id": "VIEW.2", "note": "", "phase": "3+", "text": "Boss:\n\"Build a function to select a planet and generate an effective starmap\nfrom that planet based on all visible stars, this will have to include\na lot, A LOT, of math so remind me to do research when we get there\ninto exactly how one would do that, but it would have to account for\nwhere each star would have been at that light years back in time?\"\nDone: pick a planet (or moon), and get every star visible from it\nwith its direction and brightness as seen there, placed where it was\nwhen the light now arriving left it (light-travel time back along\nits galactic orbit; the correlative update now moves everything along\ngalactic orbits, GEN.6, PR #157). The research pass covers at least:\n- which stars are visible (apparent magnitude from luminosity and\ndistance, a magnitude cut, interstellar extinction and reddening by\ndust, and whether stars beyond the generated sectors are included,\nfor example from the density skeleton or the `bright_stars` table\nfrom PR #159);\n- star colors as seen from the planet (colour from temperature,\nreddening, the planet's atmosphere and its own star's glare; Boss\nsingled out colors as needing real work);\n- light-time positions (the star's position at \"now minus distance /\nc\" along its galactic orbit), and where the planet is in its own\norbit and its sky orientation (axial tilt, rotation, latitude);\n- nebulae, the galactic band, the companion stars of the planet's own\nsystem, and performance (millions of stars per view).", "thread": "View", "title": "A starmap seen from a planet. RESEARCH WITH BOSS FIRST", "unblocks": ["VIEW.3"], "was": ""}, "VIEW.3": {"bug": false, "deps": ["VIEW.2", "VIEW.4"], "id": "VIEW.3", "note": "", "phase": "3+", "text": "Boss: \"when\nit does that it will generate a PNG and it will generate\nconstellations.\" Done: VIEW.2's view is drawn to a PNG (a sky\nprojection, star size and colour by apparent brightness), and the\nbrighter stars are grouped into constellations with lines and names\nfrom VIEW.4, stored so a planet keeps the same constellations each\ntime. Blocked on VIEW.2's research pass. Open questions: whole-sky\nor a horizon view from a point on the surface? How are constellations\nchosen (bright-star patterns, by clustering, a set number per sky)?\nAre the PNGs cached on disk and served by the web interface, or made\non request?", "thread": "View", "title": "Render the view as a PNG, with constellations", "unblocks": [], "was": ""}, "VIEW.4": {"bug": false, "deps": [], "id": "VIEW.4", "note": "Constellation names from the codec under the naming key, not sliced word lists. Floats: no blockers, can run any time.", "phase": "3+", "text": "Boss: \"add to our\nname generator constellation name support based on constellation\nnames throughout all known languages and then slice it up like we do\nfor all our naming\". Done: a constellation name list in\n`planetgen/names/wordlists.py` gathered from constellation and star-group\nnames across the world's languages and sky cultures (not just the 88\nIAU ones), and a constellation name generator that slices and\nrecombines them into new names the same way stars, planets and\nsectors are named (`split_into_syllables` in `utils.py`, the\nprefix/suffix lists, the `offensive_words.txt` filter). Used by\nVIEW.3. Open questions: what counts as a source list (licensing of\nsky culture data such as Stellarium's), transliteration of non-Latin\nscripts, and whether names are unique per planet or galaxy-wide.\nPlan (2026-10-07): Constellation names come from the codec under the\nnaming key (GEN.67), not from sliced word lists. Constellations are\nneither stars, sectors nor bodies in a system, so they use the codec\n(GEN.67's default).", "thread": "View", "title": "Constellation names in the name generator", "unblocks": ["VIEW.3"], "was": ""}}, "phases": [{"file": "phase-1-built-on-roots.md", "goal": "Object references and the picker finished, the database check and repair, resumable runs, the reworked Generate page (spans, radial fills, random neighborhoods, directives, show on the map), galaxy generation changes (phenomena placed galaxy-wide first, fill order, backfill from the run's edge, nebula volume backfill, star-type tiers), the habitability index, tech levels and facility types, spin and orbital-update thresholds with their limits, routing with unknown-space stops and charting along a course, the nearby search, Select mode and view filters on the maps, bookmarks, admin control from every screen, in-universe wording, the API log and scopes, and reproducible galaxies up to the golden-seed test.", "groups": [{"ids": ["NAV.8", "NAV.9"], "intro": "", "name": "References"}, {"ids": [], "intro": "", "name": "Picker"}, {"ids": ["DB.8", "DB.9"], "intro": "", "name": "Database consistency check"}, {"ids": ["PERF.29", "PERF.30"], "intro": "", "name": "Generation"}, {"ids": ["ADM.29", "ADM.30", "ADM.31", "GEN.96", "GEN.97", "ADM.45", "ADM.28"], "intro": "", "name": "Generate page"}, {"ids": ["GEN.24", "GEN.41", "GEN.99", "GEN.101", "GEN.102", "GEN.103"], "intro": "", "name": "Galaxy gen"}, {"ids": ["GEN.84", "GEN.85", "GEN.86", "GEN.87", "GEN.88", "GEN.89", "GEN.83"], "intro": "", "name": "Habitability"}, {"ids": ["POP.8", "POP.9", "POP.7", "POP.10"], "intro": "", "name": "Tech levels and facilities"}, {"ids": ["GEN.94"], "intro": "", "name": "Nebula planets"}, {"ids": ["GEN.104", "GEN.106", "GEN.107", "GEN.108"], "intro": "", "name": "Orbital updates"}, {"ids": ["NAV.10", "NAV.12", "UX.35", "NAV.11", "NAV.42", "NAV.47", "NAV.48"], "intro": "", "name": "Routing"}, {"ids": ["NAV.43", "NAV.44"], "intro": "", "name": "Nearby search"}, {"ids": ["MAP.119", "MAP.122"], "intro": "", "name": "Maps"}, {"ids": [], "intro": "", "name": "System Map"}, {"ids": ["UX.46", "UX.47", "UX.49"], "intro": "", "name": "Bookmarks"}, {"ids": ["ADM.32", "MAP.120", "ADM.35"], "intro": "", "name": "Admin control"}, {"ids": ["UX.23", "UX.22", "UX.3", "UX.42"], "intro": "", "name": "Pages"}, {"ids": ["ADM.15"], "intro": "", "name": "Queue"}, {"ids": ["API.15", "API.4", "API.7", "API.9"], "intro": "", "name": "API"}, {"ids": ["GEN.57", "DB.7", "GEN.58", "TEST.77", "OPS.8", "OPS.13", "OPS.14", "ADM.18", "GEN.59"], "intro": "", "name": "Reproducible galaxies"}, {"ids": ["UX.76", "ADM.39", "ADM.40", "ADM.41", "PERF.34", "GEN.127"], "intro": "", "name": "Bugs from the GitHub issues"}, {"ids": ["GEN.131", "PERF.31", "PERF.32", "GEN.128", "ADM.42"], "intro": "", "name": "Foundations for the issue features"}], "key": "1", "questions": "- NAV.8: Pages and anchors for stars, planets, moons and belts, see its entry in TODO.md.\n- NAV.11: Travel times for the system-to-system route too, see its entry in TODO.md.\n- UX.22: Meaningful units for every measurement, see its entry in TODO.md.\n- UX.3: Warn every visitor while a background job changes the galaxy, see its entry in TODO.md.\n- API.4: API compatibility data in the docs, see its entry in TODO.md.\n- OPS.13: Every update records the version key, keeping the last 10, see its entry in TODO.md.", "title": "Phase 1: Built on the groundwork"}, {"file": "phase-2-maps-picker-backfill.md", "goal": "The planet class refactor around the habitability index (with GEN.33, GEN.28, GEN.27 and GEN.29), nebula conditions on planets, n-body orbital updates and rogue collisions, editable trajectories, courses and waypoints, generate-by-recipe in the API, the backfill density pass, daily maintenance, the pilot-style visual design, light-travel positions, the asteroid-field and anomaly plans, and the API pieces remote generation needs first.", "groups": [{"ids": ["GEN.33", "GEN.28", "GEN.27", "GEN.91", "GEN.92", "GEN.29", "GEN.90"], "intro": "", "name": "Classes"}, {"ids": ["MAP.75", "MAP.59", "MAP.132"], "intro": "", "name": "Galaxy Map"}, {"ids": ["NAV.21", "NAV.17", "NAV.18", "NAV.4", "NAV.36", "NAV.39", "NAV.49"], "intro": "", "name": "Courses"}, {"ids": ["UX.32", "UX.30", "UX.43"], "intro": "", "name": "Pages"}, {"ids": ["GEN.42", "GEN.43", "PERF.18", "GEN.40"], "intro": "", "name": "Backfill"}, {"ids": ["PERF.20"], "intro": "", "name": "Queue"}, {"ids": ["API.5", "API.10", "API.11", "API.12", "API.16"], "intro": "", "name": "API"}, {"ids": [], "intro": "", "name": "3D system"}, {"ids": ["ADM.17", "OPS.15"], "i <script>
const D=JSON.parse(document.getElementById('data').textContent);
const items=D.items, ids=Object.keys(items);
const phaseOf=i=>String(items[i].phase||'');
const idKey=s=>{const [c,n]=s.split('.');return [c,+n]};
const cmp=(a,b)=>{const x=idKey(a),y=idKey(b);return x[0]<y[0]?-1:x[0]>y[0]?1:x[1]-y[1]};
const phaseOrder=['0','1','2','3','3+'];
const pr=i=>{const k=phaseOrder.indexOf(phaseOf(i));return k<0?9:k};

// depth = longest chain of open prerequisites below an item
const depth={};
function dep(i,seen=new Set()){
  if(i in depth) return depth[i];
  if(seen.has(i)) return 0;
  seen.add(i);
  const ds=(items[i].deps||[]).filter(d=>d in items);
  return depth[i]=ds.length?1+Math.max(...ds.map(d=>dep(d,seen))):0;
}
ids.forEach(i=>dep(i));
// tree parent = the prerequisite with the greatest depth (ties: highest phase, then lowest ID)
const parent={}, kids={};
ids.forEach(i=>{
  const ds=(items[i].deps||[]).filter(d=>d in items);
  if(!ds.length) return;
  ds.sort((a,b)=>depth[b]-depth[a]||pr(b)-pr(a)||cmp(a,b));
  parent[i]=ds[0];
  (kids[ds[0]]=kids[ds[0]]||[]).push(i);
});
Object.values(kids).forEach(a=>a.sort((a,b)=>pr(a)-pr(b)||cmp(a,b)));
const roots=ids.filter(i=>!(i in parent)).sort((a,b)=>cmp(a,b));
const descendants={};
function desc(i){
  if(i in descendants) return descendants[i];
  return descendants[i]=(kids[i]||[]).reduce((n,k)=>n+1+desc(k),0);
}
ids.forEach(desc);

const state={q:'',bugs:false,phases:new Set(phaseOrder)};
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const tagFor=p=>{const e=el('span','tag '+(p==='3+'?'p3p':'p'+p),p?'P'+p:'?');e.title='Phase '+p;return e};
const matches=i=>{
  const it=items[i];
  if(state.bugs&&!it.bug) return false;
  if(!state.phases.has(phaseOf(i))) return false;
  if(state.q){
    const q=state.q.toLowerCase();
    if(!(i.toLowerCase().includes(q)||it.title.toLowerCase().includes(q)||(it.note||'').toLowerCase().includes(q))) return false;
  }
  return true;
};
const filtering=()=>state.q||state.bugs||state.phases.size<phaseOrder.length;
let shown=0;
function visible(i){ // item matches, or something under it does
  return matches(i)||(kids[i]||[]).some(visible);
}
function nodeFor(i,forceOpen){
  const it=items[i], li=el('li','node'); li.id='n-'+i;
  const k=(kids[i]||[]).filter(visible);
  const head=k.length?el('summary'):el('div','leaf');
  head.append(el('span','twist',k.length?'▸':'·'),el('span','id',i),el('span','title',it.title));
  if(it.bug) head.append(el('span','tag bug','bug'));
  head.append(tagFor(phaseOf(i)));
  if(descendants[i]) head.append(el('span','tag n','unblocks '+descendants[i]));
  const others=(it.deps||[]).filter(d=>d!==parent[i]&&d in items);
  if(others.length){
    const a=el('span','also','also needs ');
    others.forEach((d,n)=>{const l=el('a',null,d);l.href='#n-'+d;l.title=items[d].title;l.addEventListener('click',e=>{e.preventDefault();jump(d)});a.append(l);if(n<others.length-1)a.append(', ')});
    head.append(a);
  }
  if(it.note){
    const n=el('span','note');
    const re=/\[([^\]]+)\]\((https:\/\/[^)\s]+)\)/g;
    let last=0,m;
    while((m=re.exec(it.note))){
      n.append(it.note.slice(last,m.index));
      const l=el('a',null,m[1]);l.href=m[2];l.target='_blank';l.rel='noopener';n.append(l);
      last=m.index+m[0].length;
    }
    n.append(it.note.slice(last));
    head.append(n);
  }
  if(matches(i)&&filtering()) li.classList.add('hit');
  if(matches(i)) shown++;
  if(!k.length){li.append(head);return li}
  const d=el('details'); if(forceOpen||filtering()) d.open=true;
  d.append(head);
  const ul=el('ul'); k.forEach(c=>ul.append(nodeFor(c,forceOpen))); d.append(ul);
  li.append(d); return li;
}
function render(){
  shown=0;
  const out=document.getElementById('out'); out.replaceChildren();
  const byPhase={};
  roots.filter(visible).forEach(r=>(byPhase[phaseOf(r)]=byPhase[phaseOf(r)]||[]).push(r));
  D.phases.forEach(p=>{
    const rs=byPhase[p.key]; if(!rs) return;
    const sec=el('section','phase'), h=el('header');
    h.append(el('div','eyebrow','Starts in phase '+p.key),el('h2',null,p.title.replace(/^Phase [^:]*:\s*/,'')));
    sec.append(h);
    const ul=el('ul','tree'); rs.forEach(r=>ul.append(nodeFor(r))); sec.append(ul); out.append(sec);
  });
  if(!out.children.length) out.append(el('p','empty','Nothing matches.'));
  document.getElementById('count').textContent=shown+' of '+ids.length+' items';
}
function jump(i){
  state.q='';state.bugs=false;state.phases=new Set(phaseOrder);syncControls();render();
  let n=document.getElementById('n-'+i); if(!n) return;
  for(let p=n.parentElement;p;p=p.parentElement) if(p.tagName==='DETAILS') p.open=true;
  n.scrollIntoView({block:'center'});
  n.classList.add('flash'); setTimeout(()=>n.classList.remove('flash'),1600);
}
function syncControls(){
  document.getElementById('q').value=state.q;
  document.getElementById('bugs').setAttribute('aria-pressed',state.bugs);
  document.querySelectorAll('#phasechips .chip').forEach(c=>c.setAttribute('aria-pressed',state.phases.has(c.dataset.p)));
}
const chips=document.getElementById('phasechips');
phaseOrder.filter(p=>D.phases.some(x=>x.key===p)&&ids.some(i=>phaseOf(i)===p)).forEach(p=>{
  const b=el('button','chip','P'+p); b.dataset.p=p; b.setAttribute('aria-pressed','true');
  b.addEventListener('click',()=>{state.phases.has(p)?state.phases.delete(p):state.phases.add(p);syncControls();render()});
  chips.append(b);
});
document.getElementById('q').addEventListener('input',e=>{state.q=e.target.value.trim();render()});
document.getElementById('bugs').addEventListener('click',()=>{state.bugs=!state.bugs;syncControls();render()});
document.getElementById('expand').addEventListener('click',()=>document.querySelectorAll('#out details').forEach(d=>d.open=true));
document.getElementById('collapse').addEventListener('click',()=>document.querySelectorAll('#out details').forEach(d=>d.open=false));
const nb=ids.filter(i=>items[i].bug).length, ready=roots.length;
document.getElementById('meta').innerHTML=
  '<span><b>'+ids.length+'</b> open items</span><span><b>'+nb+'</b> bugs</span><span><b>'+ready+'</b> with nothing to wait for</span><span>'+D.generated+'</span>';
render();
</script>
</html>
