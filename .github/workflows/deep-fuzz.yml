name: Deep fuzz

# The brute-force tests (src/tests/test_fuzz_*.py) run on every push with
# the bounded, repeatable `ci` profile. This runs them again with the
# `deep` profile: thousands of fresh random examples per test, a new seed
# each time, hunting for inputs the everyday run never reaches. A failure
# prints a `@reproduce_failure(...)` line to paste into the failing test
# (see tests/fuzz_support.py).

on:
  schedule:
    - cron: "17 6 * * 1"  # Mondays, 06:17 UTC
  workflow_dispatch:
    inputs:
      examples:
        description: "Examples per test (blank for the deep profile's default)"
        required: false
        default: ""

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: planetgen
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      PLANETGEN_TEST_MYSQL_HOST: 127.0.0.1
      PLANETGEN_TEST_MYSQL_PORT: 3306
      PLANETGEN_TEST_MYSQL_USER: root
      PLANETGEN_TEST_MYSQL_PASSWORD: ""
      PLANETGEN_FUZZ_PROFILE: deep
      PLANETGEN_FUZZ_EXAMPLES: ${{ github.event.inputs.examples }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with test/api extras
        run: python -m pip install --upgrade pip && pip install -e ".[test,api]"

      - name: Pre-fetch the NLTK 'words' corpus
        run: python -m nltk.downloader words

      - name: Run the brute-force tests with the deep profile
        run: pytest src/tests/test_fuzz_*.py -p no:cacheprovider -n auto --dist worksteal
