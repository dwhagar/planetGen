name: Release note

# Every PR adds one note under changes/ and leaves the version alone; the
# version is stamped after merge by stamp-version.yml. Separate from ci.yml
# so adding or removing the `no-release` label re-runs only this check.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

# A new push or label change supersedes the PR's earlier check.
concurrency:
  group: release-note-${{ github.ref }}
  cancel-in-progress: true

# SEC.42: the least a job needs; a job that needs more says so itself (ci.yml's dev-branch dispatcher). Actions are
# pinned by commit, the tag it was on in the comment.
permissions:
  contents: read

jobs:
  release-note:
    runs-on: ${{ fromJSON((!github.event.pull_request.head.repo.fork && vars.SELF_HOSTED == 'true' && (vars.RUNNER_LINUX || '["self-hosted", "Linux"]')) || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Check the PR's release note
        env:
          NO_RELEASE: ${{ contains(github.event.pull_request.labels.*.name, 'no-release') }}
        run: |
          flag=""
          if [ "$NO_RELEASE" = "true" ]; then flag="--allow-no-fragment"; fi
          # HEAD is GitHub's merge of the PR into the base as it stood when
          # the run was triggered, and HEAD^1 is that base. Comparing with
          # HEAD^1 rather than today's origin/$BASE_REF keeps a run that
          # waited in the queue while main moved on from failing on changes
          # main made in the meantime.
          python scripts/bump_version.py --check-pr HEAD^1 $flag
