name: CI

# Runs on its own only for a push to main (a merge, and the "Release x.y.z"
# commit stamp-version.yml pushes right after it). It does not run on a
# pull request or on a push to any other branch. To test any other branch,
# start it by hand: Actions > CI > Run workflow (workflow_dispatch), and
# pick the branch. The jobs are unchanged. stamp-version.yml and
# release-note.yml still run on their own.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# One run per workflow and branch: a newer run on the same ref cancels the
# older one that is still going (a merge's CI is cancelled by the stamp
# commit right behind it). Cancelled runs stay in the Actions history; GitHub
# has no setting to delete them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Where jobs run: see docs/ci-runners.md. Every job runs on GitHub's
# machines (ubuntu-latest, macos-latest) unless the
# repository variable SELF_HOSTED is set to true (Settings > Secrets and
# variables > Actions > Variables); then each job reads its RUNNER_*
# variable, a JSON label list or runner name, or falls back to the
# self-hosted labels written next to it. A pull request from a fork always
# runs on GitHub's machines: this repository is public, and a fork's code
# must never run on one of our own computers (docs/ci-runners.md, "Security").

jobs:
  mathcheck:
    # The math check gate (TEST.67, planetgen/physics/mathcheck.py): known
    # answers from real astronomy, identities and sampler distributions.
    # It runs first, on its own, and every other job waits for it: with
    # the math broken, their failures would only be noise.
    runs-on: ${{ fromJSON((!github.event.pull_request.head.repo.fork && vars.SELF_HOSTED == 'true' && (vars.RUNNER_LINUX || '["self-hosted", "Linux"]')) || '"ubuntu-latest"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Private virtualenv for this job
        # Self-hosted runners keep their Python between jobs; installing
        # into a fresh venv under RUNNER_TEMP (emptied for every job) keeps
        # one job's packages out of the next.
        run: python -c "import os, venv; d = os.path.join(os.environ['RUNNER_TEMP'], 'venv'); venv.create(d, with_pip=True); open(os.environ['GITHUB_PATH'], 'a').write(os.path.join(d, 'bin') + '\n')"

      - name: Install package with test extras
        run: python -m pip install --upgrade pip && pip install -e ".[test]"

      - name: Math check report
        working-directory: src
        run: python -m planetgen.physics.mathcheck --verbose

      - name: Math check tests
        run: pytest src/tests/test_math_check.py -p no:cacheprovider

  test:
    needs: mathcheck
    name: test (${{ matrix.python-version }}, ${{ matrix.db-image }}${{ matrix.workers && format(', {0} workers', matrix.workers) || '' }})
    runs-on: ${{ fromJSON((!github.event.pull_request.head.repo.fork && vars.SELF_HOSTED == 'true' && (vars.RUNNER_LINUX || '["self-hosted", "Linux"]')) || '"ubuntu-latest"') }}
    # The whole suite takes about 4 minutes on 4 cores; a run past an hour
    # is stuck, and would otherwise hold a self-hosted runner for 6 hours.
    timeout-minutes: 60
    strategy:
      # Without this, the default fail-fast:true cancels every other
      # still-running matrix leg the moment any one of them fails -- e.g.
      # a real 3.12-only failure would silently cancel 3.9 mid-run rather
      # than letting it finish and report its own (possibly different)
      # result, hiding whether the bug is version-specific.
      fail-fast: false
      # One database engine per leg. Local test runs use MariaDB 10.11
      # (what Debian/Ubuntu ship), so CI covers the others:
      # MySQL 8.0 and 8.4 are stricter about reserved words and GROUP BY
      # (the /species 404 fixed in #231 was MySQL-8-only), and MariaDB 11
      # is the next MariaDB a server upgrade would bring.
      matrix:
        include:
          - python-version: "3.9"
            db-image: mysql:8.0
            db-health: mysqladmin ping -h 127.0.0.1
          - python-version: "3.12"
            db-image: mysql:8.4
            db-health: mysqladmin ping -h 127.0.0.1
          - python-version: "3.12"
            db-image: mariadb:11.4
            db-health: healthcheck.sh --connect --innodb_initialized
          # TEST.74: the generation tests again with 2 and 4 worker
          # processes, the path a real run takes (the legs above run every
          # generation in-process, PLANETGEN_WORKERS=1). 3.12 and 3.13
          # because a dead worker once hung the pool on 3.12 (PERF.22).
          - python-version: "3.12"
            db-image: mysql:8.4
            db-health: mysqladmin ping -h 127.0.0.1
            workers: 2
          - python-version: "3.13"
            db-image: mariadb:11.4
            db-health: healthcheck.sh --connect --innodb_initialized
            workers: 4

    services:
      # conftest.py's own docstring says database-backed tests expect CI to
      # provision a real MySQL server (there's no SQLite fallback since the
      # MySQL port); everything else just skips gracefully without one.
      mysql:
        image: ${{ matrix.db-image }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
          MYSQL_DATABASE: planetgen
        ports:
          # Any free host port: a self-hosted machine may run several jobs
          # (or its own MySQL) at once, so 3306 itself may be taken.
          - 3306
        options: >-
          --health-cmd="${{ matrix.db-health }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      # The work queue and rate limits move to Redis (OPS.21, PERF.24,
      # SEC.30); tests will reach it at PLANETGEN_TEST_REDIS_URL.
      redis:
        image: redis:7
        ports:
          - 6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      PLANETGEN_TEST_MYSQL_HOST: 127.0.0.1
      PLANETGEN_TEST_MYSQL_USER: root
      PLANETGEN_TEST_MYSQL_PASSWORD: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Private virtualenv for this job
        # Self-hosted runners keep their Python between jobs; installing
        # into a fresh venv under RUNNER_TEMP (emptied for every job) keeps
        # one job's packages out of the next.
        run: python -c "import os, venv; d = os.path.join(os.environ['RUNNER_TEMP'], 'venv'); venv.create(d, with_pip=True); open(os.environ['GITHUB_PATH'], 'a').write(os.path.join(d, 'bin') + '\n')"

      - name: Install package with test/api extras
        run: python -m pip install --upgrade pip && pip install -e ".[test,api]"

      # planetgen/names/wordlists.py checks nltk.data.find() before ever
      # downloading -- pre-fetching here means a flaky/rate-limited
      # download never fails a test run partway through.
      - name: Pre-fetch the NLTK 'words' corpus
        run: python -m nltk.downloader words

      - name: Run tests
        env:
          PLANETGEN_TEST_MYSQL_PORT: ${{ job.services.mysql.ports['3306'] }}
          PLANETGEN_TEST_REDIS_URL: redis://127.0.0.1:${{ job.services.redis.ports['6379'] }}/0
          PLANETGEN_WORKERS: ${{ matrix.workers || '1' }}
        # One worker per core (docs/testing.md, "Running in parallel");
        # worksteal rebalances the few minute-long tests across workers.
        # A test still running after 10 minutes is stuck: --timeout fails
        # it with every thread's stack, so the log shows where.
        # --durations lists the slowest tests, to compare runners.
        # A worker leg runs only the `generation` tests (conftest.py).
        run: pytest -n auto --dist worksteal --timeout=600 --durations=25 ${{ matrix.workers && '-m generation' || '' }}

  browser-a11y:
    needs: mathcheck
    # tests/test_web_a11y.py: every Flask page in headless Chromium at
    # phone and desktop widths, light and dark -- axe-core (vendored under
    # src/tests/vendor/), horizontal overflow, console/CSP errors, skip
    # link. It skips in the `test` job above, which has no browser.
    runs-on: ${{ fromJSON((!github.event.pull_request.head.repo.fork && vars.SELF_HOSTED == 'true' && (vars.RUNNER_LINUX || '["self-hosted", "Linux"]')) || '"ubuntu-latest"') }}

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: planetgen
        ports:
          # Any free host port: a self-hosted machine may run several jobs
          # (or its own MySQL) at once, so 3306 itself may be taken.
          - 3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      PLANETGEN_TEST_MYSQL_HOST: 127.0.0.1
      PLANETGEN_TEST_MYSQL_USER: root
      PLANETGEN_TEST_MYSQL_PASSWORD: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Private virtualenv for this job
        # Self-hosted runners keep their Python between jobs; installing
        # into a fresh venv under RUNNER_TEMP (emptied for every job) keeps
        # one job's packages out of the next.
        run: python -c "import os, venv; d = os.path.join(os.environ['RUNNER_TEMP'], 'venv'); venv.create(d, with_pip=True); open(os.environ['GITHUB_PATH'], 'a').write(os.path.join(d, 'bin') + '\n')"

      - name: Install package with test/api/browser extras
        run: python -m pip install --upgrade pip && pip install -e ".[test,api,browser]"

      - name: Install Chromium for Playwright
        # The browser itself needs no root. Its system libraries (apt) do:
        # installed when sudo works without a password (GitHub-hosted, or a
        # self-hosted runner set up that way), otherwise assumed present.
        run: |
          python -m playwright install chromium
          if sudo -n true 2>/dev/null; then
            sudo -n "$(command -v python)" -m playwright install-deps chromium
          else
            echo "No passwordless sudo: skipping Chromium's system libraries (install them once, see docs/ci-runners.md)"
          fi

      - name: Pre-fetch the NLTK 'words' corpus
        run: python -m nltk.downloader words

      - name: Run the browser layout and accessibility tests
        # -rs lists skips, so a test that silently skipped (no browser, no
        # database) is visible in the log; the check below fails the job
        # if nothing actually ran.
        env:
          PLANETGEN_TEST_MYSQL_PORT: ${{ job.services.mysql.ports['3306'] }}
          PLANETGEN_A11Y_SCREENSHOTS: a11y-screenshots
        run: pytest src/tests/test_web_a11y.py src/tests/test_web_browser_layout.py src/tests/test_web_browser_maps.py src/tests/test_web_browser_fixture_maps.py -rs -p no:cacheprovider --junitxml=a11y.xml

      - name: Upload page screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-screenshots
          path: a11y-screenshots/
          if-no-files-found: ignore

      - name: Fail if the browser tests were all skipped
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          suite = ET.parse("a11y.xml").getroot().find("testsuite")
          ran = int(suite.get("tests")) - int(suite.get("skipped"))
          print(f"{ran} browser tests ran")
          raise SystemExit(0 if ran > 0 else "every browser test was skipped")
          PY

  linux-update:
    needs: mathcheck
    # TEST.62: install.sh and then update.sh, run for real as root on
    # Linux against a live database, the way a server runs them: a fresh
    # install, an update with nothing new, a database that needs
    # migrating, one newer than the code, an unreachable server and a
    # migration that fails. The shared database step is also tested in
    # pytest (tests/test_update_database_step.py) on every engine; this
    # job is the whole script around it, logs included (OPS.5). Like the
    # other installer jobs it changes the machine (apt, /var/lib, /var/log,
    # /etc/logrotate.d), so it only runs on a machine of your own when
    # RUNNER_LINUX_INSTALLERS names one (docs/ci-runners.md).
    runs-on: ${{ fromJSON((!github.event.pull_request.head.repo.fork && vars.SELF_HOSTED == 'true' && vars.RUNNER_LINUX_INSTALLERS) || '"ubuntu-latest"') }}
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: planetgen
        ports:
          - 3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      CHECKOUT: /var/lib/planetGen

    steps:
      - uses: actions/checkout@v4

      - name: The database's port, and a log file outside the root-owned checkout
        run: |
          echo "DB_PORT=${{ job.services.mysql.ports['3306'] }}" >> "$GITHUB_ENV"
          echo "LOG=$RUNNER_TEMP/run.log" >> "$GITHUB_ENV"

      - name: A checkout in /var/lib/planetGen whose origin has this commit as its branch
        # update.sh fetches and resets to origin's branch tip, so origin is
        # a local bare copy holding this commit as branch ci-update (the
        # Actions checkout is a detached HEAD, which update.sh refuses).
        run: |
          sudo git config --system --add safe.directory '*'
          git checkout -B ci-update
          sudo cp -R "$GITHUB_WORKSPACE" "$CHECKOUT"
          sudo git clone --quiet --bare "$CHECKOUT" /var/lib/planetGen-origin.git
          sudo git -C "$CHECKOUT" remote set-url origin /var/lib/planetGen-origin.git
          sudo tee "$CHECKOUT/config.json" > /dev/null <<EOF
          {"mysql": {"host": "127.0.0.1", "port": $DB_PORT, "user": "root", "password": "", "database": "planetgen"}}
          EOF

      - name: install.sh on a fresh database
        run: |
          cd "$CHECKOUT"
          sudo bash ./install.sh < /dev/null 2>&1 | tee "$LOG"
          grep -q "Database is at schema v" "$LOG"
          grep -q "Control schema (admin logins) is up to date." "$LOG"
          sudo test -f /var/log/planetgen.log
          sudo stat -c '%U:%G %a' /var/log/planetgen.log /var/log/planetgen/planetgen.log
          [ "$(sudo stat -c '%U:%G %a' /var/log/planetgen.log)" = "www-data:www-data 660" ]
          [ "$(sudo stat -c '%U:%G %a' /var/log/planetgen)" = "root:www-data 2770" ]

      - name: update.sh with nothing new
        run: |
          cd "$CHECKOUT"
          sudo bash ./update.sh < /dev/null 2>&1 | tee "$LOG"
          grep -q "Already up to date" "$LOG"
          if grep -q "migration step(s)" "$LOG"; then echo "asked about a migration"; exit 1; fi
          if grep -E '^  (installed|upgraded|repaired|failed) ' "$LOG"; then echo "installed something"; exit 1; fi
          grep -q "Done. Nothing new was pulled." "$LOG"

      - name: update.sh on a database that needs migrating
        # Back to the oldest schema this planetGen upgrades from (v61, the
        # Alembic baseline): the database is rebuilt from the baseline
        # fixture tests/test_db_old_schemas.py also loads, so the whole
        # revision chain runs.
        run: |
          mysql -h 127.0.0.1 -P "$DB_PORT" -u root -e "DROP DATABASE planetgen; CREATE DATABASE planetgen"
          zcat "$GITHUB_WORKSPACE/src/tests/fixtures/old_schemas/schema_v61.sql.gz" | mysql -h 127.0.0.1 -P "$DB_PORT" -u root planetgen
          mysql -h 127.0.0.1 -P "$DB_PORT" -u root planetgen -e "INSERT INTO schema_migrations (version) VALUES (61)"
          cd "$CHECKOUT"
          sudo bash ./update.sh < /dev/null 2>&1 | tee "$LOG"
          grep -q "is at schema v61" "$LOG"
          grep -q "keeping the data and migrating it" "$LOG"
          [ "$(mysql -h 127.0.0.1 -P "$DB_PORT" -u root planetgen -N -e 'SELECT MAX(version) FROM schema_migrations')" -gt 61 ]

      - name: update.sh refuses a database newer than the code
        run: |
          mysql -h 127.0.0.1 -P "$DB_PORT" -u root planetgen -e \
            "INSERT INTO schema_migrations (version) SELECT MAX(version) + 1 FROM schema_migrations"
          cd "$CHECKOUT"
          if sudo bash ./update.sh < /dev/null > "$LOG" 2>&1; then cat "$LOG"; echo "update.sh should have failed"; exit 1; fi
          cat "$LOG"
          grep -q "newer than this code" "$LOG"
          if grep -q Traceback "$LOG"; then exit 1; fi
          mysql -h 127.0.0.1 -P "$DB_PORT" -u root planetgen -e \
            "DELETE FROM schema_migrations WHERE version = (SELECT v FROM (SELECT MAX(version) AS v FROM schema_migrations) AS t)"

      - name: update.sh stops on an unreachable server
        run: |
          cd "$CHECKOUT"
          sudo sed -i "s/\"port\": $DB_PORT/\"port\": 1/" config.json
          if sudo bash ./update.sh < /dev/null > "$LOG" 2>&1; then cat "$LOG"; echo "update.sh should have failed"; exit 1; fi
          cat "$LOG"
          grep -q "^error:" "$LOG"
          if grep -q Traceback "$LOG"; then exit 1; fi
          sudo sed -i "s/\"port\": 1/\"port\": $DB_PORT/" config.json

      - name: update.sh stops on a failed migration and keeps the version
        run: |
          mysql -h 127.0.0.1 -P "$DB_PORT" -u root -e "DROP DATABASE planetgen; CREATE DATABASE planetgen"
          zcat "$GITHUB_WORKSPACE/src/tests/fixtures/old_schemas/schema_v61.sql.gz" | mysql -h 127.0.0.1 -P "$DB_PORT" -u root planetgen
          mysql -h 127.0.0.1 -P "$DB_PORT" -u root -e \
            "INSERT INTO planetgen.schema_migrations (version) VALUES (61);
             CREATE USER 'readonly'@'%' IDENTIFIED BY 'readonly-pw'; GRANT SELECT ON planetgen.* TO 'readonly'@'%';"
          cd "$CHECKOUT"
          sudo sed -i 's/"user": "root", "password": ""/"user": "readonly", "password": "readonly-pw"/' config.json
          if sudo bash ./update.sh < /dev/null > "$LOG" 2>&1; then cat "$LOG"; echo "update.sh should have failed"; exit 1; fi
          cat "$LOG"
          grep -q "is at schema v61" "$LOG"
          grep -q "denied" "$LOG"
          [ "$(mysql -h 127.0.0.1 -P "$DB_PORT" -u root planetgen -N -e 'SELECT MAX(version) FROM schema_migrations')" = 61 ]

  macos-installers:
    needs: mathcheck
    # install.sh and its helpers on macOS, under /bin/bash 3.2 as a Mac
    # ships it: the venv from Homebrew's python3, the _www permissions,
    # newsyslog, and gunicorn under launchd answering on 127.0.0.1:8000.
    # No database here (--skip-database).
    runs-on: ${{ fromJSON((!github.event.pull_request.head.repo.fork && vars.SELF_HOSTED == 'true' && vars.RUNNER_MACOS_INSTALLERS) || '"macos-latest"') }}
    steps:
      - uses: actions/checkout@v4

      - name: Every bash script parses under bash 3.2
        run: |
          /bin/bash --version | head -n1
          for f in install.sh update.sh scripts/*.sh examples/apache/*.sh examples/maintenance/*.sh; do
            /bin/bash -n "$f" || exit 1
          done

      - name: Homebrew's Python
        run: brew list python@3.12 >/dev/null 2>&1 || brew install python@3.12

      - name: install.sh into /var/lib/planetGen, as the macOS guide lays it out
        run: |
          sudo mkdir -p /var/lib
          sudo cp -R "$GITHUB_WORKSPACE" /var/lib/planetGen
          # PATH without Homebrew, so the helper scripts' `#!/usr/bin/env bash`
          # finds /bin/bash (3.2) too, not Homebrew's bash 5.
          sudo env PATH=/usr/bin:/bin:/usr/sbin:/sbin /bin/bash /var/lib/planetGen/install.sh --skip-database

      - name: gunicorn answers under launchd
        run: |
          code=000
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/health || true)
            [ "$code" != "000" ] && break
            sleep 2
          done
          echo "GET /api/health: HTTP $code"
          if [ "$code" = "000" ]; then sudo cat /usr/local/planetgen/log/gunicorn.log; exit 1; fi

      - name: The update check installs nothing more
        run: |
          sudo env PATH=/usr/bin:/bin:/usr/sbin:/sbin /bin/bash /var/lib/planetGen/scripts/install-python-deps.sh --check | tee check.log
          ! grep -E '^  (installed|upgraded|repaired|failed) ' check.log

      - name: install-maintenance-timer.sh makes launchd daemons
        run: |
          sudo env PATH=/usr/bin:/bin:/usr/sbin:/sbin /bin/bash /var/lib/planetGen/examples/maintenance/install-maintenance-timer.sh ci_test
          sudo launchctl print system/org.planetgen.orbits.ci_test | head -n 5
          sudo launchctl print system/org.planetgen.update | head -n 5
          grep -q '<string>ci_test</string>' /Library/LaunchDaemons/org.planetgen.orbits.ci_test.plist

  dependency-audit:
    needs: mathcheck
    runs-on: ${{ fromJSON((!github.event.pull_request.head.repo.fork && vars.SELF_HOSTED == 'true' && (vars.RUNNER_LINUX || '["self-hosted", "Linux"]')) || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Private virtualenv for this job
        # Self-hosted runners keep their Python between jobs; installing
        # into a fresh venv under RUNNER_TEMP (emptied for every job) keeps
        # one job's packages out of the next.
        run: python -c "import os, venv; d = os.path.join(os.environ['RUNNER_TEMP'], 'venv'); venv.create(d, with_pip=True); open(os.environ['GITHUB_PATH'], 'a').write(os.path.join(d, 'bin') + '\n')"

      - name: Install package with test/api extras
        run: python -m pip install --upgrade pip setuptools && pip install -e ".[test,api]"

      - name: Scan installed dependencies for known vulnerabilities
        # PYSEC-2026-3740 (nltk): a path-sandbox bypass in its model
        # persistence helpers (TransitionParser.train/parse,
        # AveragedPerceptron.save/load, PerceptronTagger.save_to_json,
        # save_maxent_params) -- unpatched upstream as of this writing.
        # planetgen/names/wordlists.py only ever calls nltk.corpus.words,
        # nltk.data.find, and nltk.download, never any of the affected
        # APIs, so this isn't reachable here. Ignored by ID (not skipped
        # wholesale) so a real, relevant finding still fails this job, and
        # so this line itself needs revisiting once a fix ships.
        run: pip install pip-audit && pip-audit --ignore-vuln PYSEC-2026-3740

      - name: Scan the locked dependencies for known vulnerabilities
        # requirements.lock is what servers install (scripts/
        # install-python-deps.sh, --require-hashes); same ignore as above.
        run: pip-audit --require-hashes -r requirements.lock --ignore-vuln PYSEC-2026-3740
